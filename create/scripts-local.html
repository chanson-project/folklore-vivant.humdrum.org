<script>

function extractKernSegments(kern) {
  const rows = kern.split(/\r?\n/);
  const segments = [];

  let current = [];
  let inside = false;

  rows.forEach(function(row) {
    if (!row) return;

    const cols = row.split('\t');
    const melody = cols[0];

    if (!melody) return;

    if (melody.includes('{')) {
      inside = true;
      current = [];
    }

    if (inside) {
      current.push(row);
    }

    if (melody.includes('}') && inside) {
      segments.push(current.join('\n'));
      current = [];
      inside = false;
    }
  });

  return segments;
}


function extractKernHeader(kern) {
  const rows = kern.split(/\r?\n/);
  const header = [];

  for (const row of rows) {
    if (!row) continue;

    const cols = row.split('\t');
    const melody = cols[0];

    if (!melody) continue;

    if (melody.includes('{')) {
      break;
    }

    if (
      melody.startsWith('**') ||
      melody.startsWith('*') ||
      melody.startsWith('!')
    ) {
      header.push(row);
    }
  }

  return header;
}

function buildMiniKern(headerLines, segmentText) {
  const segmentRows = segmentText.split(/\r?\n/);

  // Determine the number of active spines
  // at the end of this phrase.
  const lastSpineRow = [...segmentRows]
    .reverse()
    .find(function(row) {
      return row.trim() &&
        !row.startsWith('!!') &&
        !row.startsWith('!');
    });

  let spineCount = 1;

  if (lastSpineRow) {
    spineCount = lastSpineRow.split('\t').length;
  } else {
    const header = headerLines.find(function(row) {
      return row.startsWith('**');
    });

    if (header) {
      spineCount = header.split('\t').length;
    }
  }

  const terminator = Array(spineCount)
    .fill('*-')
    .join('\t');

  return [
    ...headerLines,
    ...segmentRows,
    terminator
  ].join('\n');
}

let CREATE_TEMPO = 120;

function setCreateTempo(value) {
  const tempo = Math.max(40, Math.min(240, Number(value) || 120));

  CREATE_TEMPO = tempo;

  const input = document.getElementById('create-tempo-input');

  if (input) {
    input.value = tempo;
  }

  if (typeof KernPlayer !== 'undefined') {
    KernPlayer.setTempo(tempo);
  }
}

    console.error('No KERN data available for this phrase.');
    return;
  }

  if (typeof KernPlayer === 'undefined') {
    console.error('KernPlayer is not available.');
    return;
  }

  const kpBtn =
    document.getElementById('audiobutton-play');

  if (!kpBtn) {
    console.error('KernPlayer play button was not found.');
    return;
  }


  // Stop anything currently playing.
  KernPlayer.stop();


  // Load only this phrase.
  KernPlayer.load(kern);

  // Apply the tempo selected on the Create page.
  KernPlayer.setTempo(CREATE_TEMPO);


  console.log(
    'Playing Phrase ' +
    (Number(button.dataset.line) + 1)
  );


  // Start playback through KernPlayer's hidden button.
  setTimeout(function() {

    kpBtn.click();

  }, 100);

}

const initialHeader = headerLines.find(

// Restore the missing split for phrases that

if (

        // Save phrase KERN for playback

if (phraseBlock) {

        console.log(

});

// Replace the original lyric tokens while preserving
// the musical data and Humdrum spine structure.
// Replace lyrics in a Humdrum phrase without changing notes.
function replacePhraseLyrics(originalKern, newLyrics) {
  const rows = originalKern.split(/\r?\n/);

  const headerIndex = rows.findIndex(row =>
    row.startsWith('**')
  );

  if (headerIndex === -1) {
    throw new Error('Humdrum header not found.');
  }

  const headerCols = rows[headerIndex].split('\t');

  if (!headerCols.includes('**text')) {
    throw new Error('No **text lyric spine found.');
  }

  // Track active spine types.
  let spines = headerCols.slice();

  const lyricPositions = [];
  const lyricCells = [];

  function isDataRow(cols) {
    return cols.length > 0 &&
      !cols[0].startsWith('*') &&
      !cols[0].startsWith('=');
  }

  // Scan lyric tracks and preserve spine structure.
  for (let i = headerIndex + 1; i < rows.length; i++) {
    const row = rows[i];

    if (!row || row.startsWith('!')) {
      continue;
    }

    const cols = row.split('\t');

    if (cols.length !== spines.length) {
      throw new Error(
        'Spine count mismatch at line ' + (i + 1)
      );
    }

    if (cols.every(token => token.startsWith('*'))) {
      if (cols.some(token =>
        token === '*v' ||
        token === '*x' ||
        token === '*+'
      )) {
        throw new Error(
          'Unsupported spine operation at line ' + (i + 1)
        );
      }

      const nextSpines = [];

      cols.forEach((token, index) => {
        if (token === '*^') {
          nextSpines.push(
            spines[index],
            spines[index]
          );
        } else if (token !== '*-') {
          nextSpines.push(spines[index]);
        }
      });

      spines = nextSpines;
      continue;
    }

    if (!isDataRow(cols)) {
      continue;
    }

    const firstTextIndex = spines.indexOf('**text');

    if (firstTextIndex === -1) {
      continue;
    }

    // Store every non-null lyric location so that
    // original lyrics from all verses can be cleared.
    cols.forEach((token, column) => {
      if (
        spines[column] === '**text' &&
        token !== '.'
      ) {
        lyricCells.push({
          rowIndex: i,
          colIndex: column
        });
      }
    });

    // Use the first lyric spine for the new lyrics.
    // Existing non-null tokens define available slots.
    if (cols[firstTextIndex] !== '.') {
      lyricPositions.push({
        rowIndex: i,
        colIndex: firstTextIndex
      });
    }
  }

  const newTokens = newLyrics
    .trim()
    .split(/\s+/)
    .filter(Boolean);

  if (
    newTokens.length > 0 &&
    lyricPositions.length === 0
  ) {
    throw new Error(
      'No lyric positions available in this phrase.'
    );
  }

  if (newTokens.length > lyricPositions.length) {
    throw new Error(
      'You entered ' + newTokens.length +
      ' lyric units, but this phrase has only ' +
      lyricPositions.length +
      ' positions. Please adjust the lyrics.'
    );
  }

  // Clear all original lyric tokens.
  lyricCells.forEach(position => {
    const cols = rows[position.rowIndex].split('\t');

    cols[position.colIndex] = '.';

    rows[position.rowIndex] = cols.join('\t');
  });

  // Insert the user's new lyrics.
  lyricPositions.forEach((position, index) => {
    if (index >= newTokens.length) {
      return;
    }

    const cols = rows[position.rowIndex].split('\t');

    cols[position.colIndex] = newTokens[index];

    rows[position.rowIndex] = cols.join('\t');
  });

  return rows.join('\n');
}

// Export Create compositions with user lyrics in the score.
(function () {

  const escapeHtml = value =>
    String(value).replace(/[&<>"']/g, char => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[char]));

  // Render modified Humdrum in a temporary area.
  function renderExportScore(kern, index) {
    return new Promise((resolve, reject) => {

      const container = document.createElement('div');
      container.style.cssText =
        'position:absolute;left:-100000px;top:0;' +
        'width:900px;visibility:hidden;pointer-events:none;';

      const source = document.createElement('script');
      source.type = 'text/x-humdrum';
      source.id = 'create-export-score-' + index;
      source.textContent = kern;

      container.appendChild(source);
      document.body.appendChild(container);

      let finished = false;
      let observer;
      let timeout;

      function finish(error, svg) {
        if (finished) return;
        finished = true;

        if (observer) observer.disconnect();
        clearTimeout(timeout);

        const output = svg ? svg.outerHTML : null;
        container.remove();

        if (error) reject(error);
        else resolve(output);
      }

      function checkScore() {
    const svg = [...container.querySelectorAll('svg')]
    .find(el =>
      el.querySelector('defs') &&
      el.querySelector('style') &&
      el.querySelector('.note')
    );

    if (svg) finish(null, svg);
}

      observer = new MutationObserver(checkScore);

      observer.observe(container, {
        childList: true,
        subtree: true
      });

      timeout = setTimeout(() => {
        finish(new Error(
          'Verovio rendering timed out for Phrase ' +
          (index + 1)
        ));
      }, 20000);

      try {
        displayHumdrum({ source: source.id });
        checkScore();
      } catch (error) {
        finish(error);
      }
    });
  }

  async function exportCreatePdf() {
    const button =
      document.getElementById('create-save-pdf');

    const scores = Array.from(
      document.querySelectorAll('.create-line-block')
    );

    if (!scores.length ||
        scores.some(block =>
          !block.querySelector('.create-line-music svg .note')
        )) {
      alert('Please wait until all scores have loaded.');
      return;
    }

    // Open immediately to avoid popup blockers.
    const printWindow = window.open('', '_blank');

    if (!printWindow) {
      alert('Please allow pop-ups to export the PDF.');
      return;
    }

    printWindow.document.body.textContent =
      'Preparing your score...';

    if (button) {
      button.disabled = true;
      button.textContent = '⏳ Preparing PDF...';
    }

    try {
      const originalTitle =
        document.getElementById('create-title')
          ?.textContent || 'Song';

      const customTitle =
        document.getElementById('create-user-title')
          ?.value.trim();

      const title = customTitle || originalTitle;

      const composer =
        document.getElementById('create-composer')
          ?.textContent || '';

      const songId =
        document.getElementById('create-song-id')
          ?.textContent || '';

      const printable = [];

      for (let index = 0; index < scores.length; index++) {
        const block = scores[index];

        const lyrics =
          block.querySelector('.create-line-input')
            ?.value.trim() || '';

        let svgHtml;

        if (lyrics) {
          const originalKern =
            block.dataset.originalKern;

          if (!originalKern) {
            throw new Error(
              'Original Humdrum missing for Phrase ' +
              (index + 1)
            );
          }

          let modifiedKern;

          try {
            modifiedKern = replacePhraseLyrics(
              originalKern,
              lyrics
            );
          } catch (error) {
            throw new Error(
              'Phrase ' + (index + 1) +
              ': ' + error.message
            );
          }

          svgHtml = await renderExportScore(
            modifiedKern,
            index
          );

        } else {
          const originalSvg = [
    ...block.querySelectorAll('.create-line-music svg')
          ].find(svg =>
    svg.querySelector('defs') &&
    svg.querySelector('style') &&
    svg.querySelector('.note')
          );

          if (!originalSvg) {
            throw new Error(
              'Original score missing for Phrase ' +
              (index + 1)
            );
          }

          svgHtml = originalSvg.outerHTML;
        }

        printable.push(`
          <section class="phrase">
            <h2>Phrase ${index + 1}</h2>
            <div class="score">${svgHtml}</div>
          </section>
        `);
      }

      const html = `
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <title>${escapeHtml(title)}</title>
          <style>
            @page {
              size: A4;
              margin: 12mm;
            }

            body {
              font-family: Arial, sans-serif;
              color: #222;
              margin: 0;
            }

            h1 {
              text-align: center;
              font-size: 24px;
              margin: 0 0 8px;
            }

            .metadata {
              text-align: center;
              color: #666;
              font-size: 12px;
              margin-bottom: 22px;
            }

            .phrase {
              break-inside: avoid;
              page-break-inside: avoid;
              margin-bottom: 18px;
            }

            h2 {
              font-size: 14px;
              margin: 0 0 8px;
            }

            .score svg {
              display: block;
              width: 100%;
              height: auto;
              max-width: 100%;
            }
          </style>
        </head>
        <body>
          <h1>${escapeHtml(title)}</h1>
          <div class="metadata">
            ${escapeHtml(composer)}
            · ${escapeHtml(songId)}
            <div>
              Based on: ${escapeHtml(originalTitle)}
            </div>
          </div>

          ${printable.join('')}
        </body>
        </html>
      `;

      printWindow.document.open();
      printWindow.document.write(html);
      printWindow.document.close();

      // Print once the document and SVGs are laid out.
      await new Promise(resolve => {
        if (printWindow.document.readyState === 'complete') {
          resolve();
        } else {
          printWindow.addEventListener('load', resolve, {
            once: true
          });
        }
      });

      await printWindow.document.fonts.ready;

      printWindow.focus();
      printWindow.print();

    } catch (error) {
      console.error('Create PDF export failed:', error);

      if (!printWindow.closed) {
        printWindow.close();
      }

      alert(
        'PDF export failed: ' + error.message
      );

    } finally {
      if (button) {
        button.disabled = false;

        button.textContent =
          window.LANG === 'fr'
            ? '📄 Enregistrer en PDF'
            : '📄 Save as PDF';
      }
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    const button =
      document.getElementById('create-save-pdf');

    if (!button) return;

    button.textContent =
      window.LANG === 'fr'
        ? '📄 Enregistrer en PDF'
        : '📄 Save as PDF';

    button.addEventListener('click', exportCreatePdf);
  });

})();

</script>
