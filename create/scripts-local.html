<script>

function extractKernSegments(kern) {
  const rows = kern.split(/\r?\n/);
  const segments = [];

  let current = [];
  let inside = false;

  rows.forEach(function(row) {
    if (!row) return;

    const cols = row.split('\t');
    const melody = cols[0];

    if (!melody) return;

    if (melody.includes('{')) {
      inside = true;
      current = [];
    }

    if (inside) {
      current.push(row);
    }

    if (melody.includes('}') && inside) {
      segments.push(current.join('\n'));
      current = [];
      inside = false;
    }
  });

  return segments;
}

function extractKernHeader(kern) {
  const rows = kern.split(/\r?\n/);
  const header = [];

  for (const row of rows) {
    if (!row) continue;

    const cols = row.split('\t');
    const melody = cols[0];

    if (!melody) continue;

    if (melody.includes('{')) {
      break;
    }

    if (
      melody.startsWith('**') ||
      melody.startsWith('*') ||
      melody.startsWith('!')
    ) {
      header.push(melody);
    }
  }

  return header;
}

function buildMiniKern(headerLines, segmentText) {
  const segmentRows = segmentText.split(/\r?\n/).map(function(row) {
    return row.split('\t')[0]; 
  });

  return [
    ...headerLines,
    ...segmentRows,
    '*-'
  ].join('\n');
}

document.addEventListener('DOMContentLoaded', function() {
  const params = new URLSearchParams(window.location.search);
  const songId = params.get('song');

  const backLink = document.getElementById('create-back-link');
  const songIdEl = document.getElementById('create-song-id');
  const titleEl = document.getElementById('create-title');
  const composerEl = document.getElementById('create-composer');
  const linesEl = document.getElementById('create-lines');

  if (backLink && songId) {
    backLink.href = '/sing/#' + encodeURIComponent(songId);
  }

  if (!songId) {
    songIdEl.textContent = 'No song selected';
    return;
  }

  const work = CREATE_WORKS.find(function(w) {
    return w['!!!id'] === songId;
  });

  if (!work) {
    songIdEl.textContent = songId;
    titleEl.textContent = 'Song not found';
    return;
  }

  songIdEl.textContent = songId;

  const originalTitle = work['!!!OTL@@FR'] || 'Untitled';

  titleEl.textContent = originalTitle;
  composerEl.textContent = work['!!!COM'] || '';

  const originalTitleEl = document.getElementById('create-original-title');

  if (originalTitleEl) {
    originalTitleEl.textContent = originalTitle;
  }

  const filename = work['!!!file-name'] || '';
  const prefix = songId.substring(0, 2).toUpperCase();
  const dir = prefix === 'BC' ? 'bc' : 'eg';

  if (!filename) {
    linesEl.textContent = 'Lyrics unavailable.';
    return;
  }

  const textFilename = filename.replace(/\.krn$/, '.txt');

  const baseUrl =
    'https://raw.githubusercontent.com/chanson-project/chanson-encoding/refs/heads/main/';

  const textUrl =
    baseUrl +
    dir +
    '/text/' +
    textFilename;

  const kernUrl =
    baseUrl +
    dir +
    '/kern/' +
    filename;


  // Load lyrics and score together.
  Promise.all([
    fetch(textUrl).then(function(response) {
      if (!response.ok) {
        throw new Error('Lyrics HTTP ' + response.status);
      }

      return response.text();
    }),

    fetch(kernUrl).then(function(response) {
      if (!response.ok) {
        throw new Error('KERN HTTP ' + response.status);
      }

      return response.text();
    })
  ])
  .then(function(results) {

    const text = results[0];
    const kern = results[1];

    let lyricLines = text
      .trim()
      .split(/\r?\n/)
      .map(function(line) {
        return line.trim();
      })
      .filter(function(line) {
        return line.length > 0;
      });

    const segments = extractKernSegments(kern);
    const headerLines = extractKernHeader(kern);

    console.log('LYRIC LINES:', lyricLines);
    console.log('LYRIC COUNT:', lyricLines.length);

    console.log('SEGMENTS:', segments);
    console.log('SEGMENT COUNT:', segments.length);


    /*
     * Some text files contain the song title as the first line.
     *
     * Only remove it when:
     *
     * 1. There is exactly one more text line than music segment.
     * 2. The first line matches the metadata title.
     *
     * This prevents us from accidentally deleting a real first lyric.
     */
    function normalizeText(value) {
      return String(value || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/[^\p{L}\p{N}]+/gu, ' ')
        .trim()
        .replace(/\s+/g, ' ');
    }

    if (
      lyricLines.length === segments.length + 1 &&
      normalizeText(lyricLines[0]) === normalizeText(originalTitle)
    ) {
      console.log('Removing title from lyric lines:', lyricLines[0]);
      lyricLines.shift();
    }


    // Clear "Loading song..."
    linesEl.innerHTML = '';


    // Create one editor block for every lyric line.
    lyricLines.forEach(function(line, index) {

      const lineBlock = document.createElement('div');
      lineBlock.className = 'create-line-block';


      // Line heading
      const header = document.createElement('div');
      header.className = 'create-line-header';
      header.textContent = 'Line ' + (index + 1);


      // Music
      const music = document.createElement('div');
      music.className = 'create-line-music';
      music.dataset.line = index;


      // Original lyric
      const originalLine = document.createElement('div');
      originalLine.className = 'create-original-line';

      const originalLabel = document.createElement('strong');
      originalLabel.textContent = 'Original: ';

      const originalText = document.createElement('span');
      originalText.textContent = line;

      originalLine.appendChild(originalLabel);
      originalLine.appendChild(originalText);


      // User version
      const inputWrap = document.createElement('div');
      inputWrap.className = 'create-input-line';

      const input = document.createElement('input');

      input.type = 'text';
      input.className = 'create-line-input';
      input.placeholder = 'Try your own words...';
      input.dataset.line = index;

      inputWrap.appendChild(input);


      lineBlock.appendChild(header);
      lineBlock.appendChild(music);
      lineBlock.appendChild(originalLine);
      lineBlock.appendChild(inputWrap);

      linesEl.appendChild(lineBlock);
    });


    // Render corresponding score segment for every line.
    segments.forEach(function(segment, index) {

      const musicBox = document.querySelector(
        '.create-line-music[data-line="' + index + '"]'
      );

      if (!musicBox) {
        console.warn(
          'No lyric line exists for music segment ' + index
        );

        return;
      }

      const miniKern = buildMiniKern(
        headerLines,
        segment
      );

      console.log(
        'SCORE FOR LINE ' + (index + 1) + ':'
      );

      console.log(miniKern);


      const scoreSource =
        document.createElement('script');

      scoreSource.type = 'text/x-humdrum';

      scoreSource.id =
        'create-score-' + index;

      scoreSource.textContent = miniKern;


      musicBox.innerHTML = '';

      musicBox.appendChild(scoreSource);


      if (typeof displayHumdrum === 'function') {

        displayHumdrum({
          source: scoreSource.id
        });

      } else {

        console.error(
          'displayHumdrum is not available.'
        );

      }
    });


    if (lyricLines.length !== segments.length) {

      console.warn(
        'Lyrics/music count mismatch:',
        lyricLines.length,
        'lyrics vs',
        segments.length,
        'music segments'
      );

    }

  })
  .catch(function(error) {

    console.error(
      'Could not load song:',
      error
    );

    linesEl.textContent =
      'Song data unavailable.';

  });

});

</script>
