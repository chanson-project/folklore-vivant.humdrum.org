<script>

function extractKernSegments(kern) {
  const rows = kern.split(/\r?\n/);
  const segments = [];

  let current = [];
  let inside = false;

  rows.forEach(function(row) {
    if (!row) return;

    const cols = row.split('\t');
    const melody = cols[0];

    if (!melody) return;

    if (melody.includes('{')) {
      inside = true;
      current = [];
    }

    if (inside) {
      current.push(row);
    }

    if (melody.includes('}') && inside) {
      segments.push(current.join('\n'));
      current = [];
      inside = false;
    }
  });

  return segments;
}

function extractPhraseLyrics(segment, kern, phraseIndex) {
  const header = kern.split(/\r?\n/)
    .find(row => row.startsWith('**'));

  if (!header) return '';

  const textCount = header.split('\t')
    .filter(type => type === '**text').length;

  if (textCount === 0) return '';

  const streams = Array.from(
    { length: textCount },
    () => []
  );

  const rows = segment.split(/\r?\n/)
    .filter(row =>
      row.trim() &&
      !row.startsWith('!') &&
      !row.startsWith('*') &&
      !row.startsWith('=')
    );

  rows.forEach(function(row) {
    const cols = row.split('\t');

    // For BC003-style files, lyric spines
    // occupy the final columns.
    const textCols = cols.slice(-textCount);

    textCols.forEach(function(token, index) {
      if (
        token &&
        token !== '.' &&
        !token.startsWith('!')
      ) {
        streams[index].push(token);
      }
    });
  });

  // Display only the first original lyric version.
  const first = streams.find(
    tokens => tokens.length > 0
  ) || [];

  return first
    .join(' ')
    .replace(/-\s+/g, '-')
    .replace(/\s+([,.;!?])/g, '$1')
    .trim();
}


function extractKernHeader(kern) {
  const rows = kern.split(/\r?\n/);
  const header = [];

  for (const row of rows) {
    if (!row) continue;

    const cols = row.split('\t');
    const melody = cols[0];

    if (!melody) continue;

    if (melody.includes('{')) {
      break;
    }

    if (
      melody.startsWith('**') ||
      melody.startsWith('*') ||
      melody.startsWith('!')
    ) {
      header.push(row);
    }
  }

  return header;
}

function buildMiniKern(headerLines, segmentText) {
  const segmentRows = segmentText.split(/\r?\n/);

  // Determine the number of active spines
  // at the end of this phrase.
  const lastSpineRow = [...segmentRows]
    .reverse()
    .find(function(row) {
      return row.trim() &&
        !row.startsWith('!!') &&
        !row.startsWith('!');
    });

  let spineCount = 1;

  if (lastSpineRow) {
    spineCount = lastSpineRow.split('\t').length;
  } else {
    const header = headerLines.find(function(row) {
      return row.startsWith('**');
    });

    if (header) {
      spineCount = header.split('\t').length;
    }
  }

  const terminator = Array(spineCount)
    .fill('*-')
    .join('\t');

  return [
    ...headerLines,
    ...segmentRows,
    terminator
  ].join('\n');
}


// CREATE_FOUR_FEATURES_V1: verse selection and child-friendly lyric editing.
function createTextSpineIndices(kern) {
  const header = kern.split(/\r?\n/).find(row => row.startsWith('**'));
  if (!header) return [];
  return header.split('\t').flatMap((name, index) => name === '**text' ? [index] : []);
}

// A syllable unit is separated by whitespace or a hyphen. This is an estimate,
// not a French linguistic syllabifier (silent letters and elision are special).
function createSyllableUnits(text) {
  return String(text || '').trim().split(/[\s-]+/).filter(Boolean);
}

function createVerseTokens(segment, textColumn) {
  if (textColumn == null || textColumn < 0) return [];
  return segment.split(/\r?\n/).flatMap(row => {
    if (!row || /^[!*=@]/.test(row)) return [];
    const token = row.split('\t')[textColumn];
    return token && token !== '.' && !token.startsWith('!') ? [token] : [];
  });
}

function createPrettyLyrics(tokens) {
  return tokens.join(' ').replace(/-\s+/g, '-').replace(/\s+([,.;!?])/g, '$1');
}

function createUpdateCounter(block) {
  const textInput = block.querySelector('.create-line-input');
  const count = block.querySelector('.create-syllable-count');
  if (!textInput || !count) return;
  const expected = Number(block.dataset.syllableTarget || 0);
  const actual = createSyllableUnits(textInput.value).length;
  count.textContent = `${actual} / ${expected} syllables`;
  count.classList.toggle('create-count-over', actual > expected);
  count.classList.toggle('create-count-match', actual === expected && expected > 0);
  count.setAttribute('aria-label', `${actual} of ${expected} expected syllables`);
}

function createBuildSyllableInputs(block, tokens) {
  const wrap = block.querySelector('.create-syllable-fields');
  const textInput = block.querySelector('.create-line-input');
  if (!wrap || !textInput) return;
  wrap.replaceChildren();
  const slots = tokens.length;
  block.dataset.syllableTarget = String(slots);
  // Keep existing text on verse switch; avoid silently deleting child edits.
  const draft = createSyllableUnits(textInput.value);
  for (let n = 0; n < slots; n++) {
    const cell = document.createElement('label');
    cell.className = 'create-syllable-cell';
    const field = document.createElement('input');
    field.type = 'text';
    field.className = 'create-syllable-input';
    field.maxLength = 64;
    field.autocomplete = 'off';
    field.setAttribute('aria-label', `Syllable ${n + 1}`);
    field.placeholder = String(n + 1);
    field.value = draft[n] || '';
    field.addEventListener('input', () => {
      // Existing PDF export reads .create-line-input; preserve its interface.
      const values = [...wrap.querySelectorAll('.create-syllable-input')].map(el => el.value.trim());
      // Preserve the position of blanks when there are later filled boxes.
      const lastFilled = values.reduce((last, item, i) => item ? i : last, -1);
      textInput.value = values.slice(0, lastFilled + 1).map(v => v || '.').join(' ');
      createUpdateCounter(block);
    });
    cell.appendChild(field);
    wrap.appendChild(cell);
  }
  textInput.addEventListener('input', () => {
    const values = createSyllableUnits(textInput.value);
    wrap.querySelectorAll('.create-syllable-input').forEach((field, i) => {
      field.value = values[i] || '';
    });
    createUpdateCounter(block);
  });
  createUpdateCounter(block);
}

function createMakeScoreSource(phraseKern, kind, textColumn) {
  if (kind === 'melody') return '!!!filter: extract -s 1\n' + phraseKern;
  if (textColumn == null) return '!!!filter: extract -s 1\n' + phraseKern;
  // Humdrum extract is one-based. Keep the melody and one selected text spine.
  return `!!!filter: extract -s 1,${textColumn + 1}\n` + phraseKern;
}

function createUpdateVerse(root, selectedColumn) {
  root.querySelectorAll('.create-line-block').forEach(block => {
    const segment = block._createSegment;
    const kern = block.dataset.originalKern;
    if (!segment || !kern) return;
    const tokens = createVerseTokens(segment, selectedColumn);
    const original = block.querySelector('.create-original-lyrics');
    if (original) original.textContent = createPrettyLyrics(tokens);
    createBuildSyllableInputs(block, tokens);
    const originalScore = block.querySelector('.create-score-version[data-score="original"]');
    if (!originalScore) return;
    const source = originalScore.querySelector('script[type="text/x-humdrum"]');
    if (!source) return;
    source.textContent = createMakeScoreSource(kern, 'original', selectedColumn);
    originalScore.querySelectorAll('svg').forEach(svg => svg.remove());
    if (typeof displayHumdrum === 'function') {
      displayHumdrum({source: source.id});
    }
  });
}

let CREATE_TEMPO = 120;

function setCreateTempo(value, activeScale = null) {
  const parsed = Number(value);

  const tempo = Math.max(
    20,
    Math.min(240, Number.isFinite(parsed) && parsed > 0
      ? Math.round(parsed)
      : 120)
  );

  CREATE_TEMPO = tempo;

  const input = document.getElementById('create-tempo-input');
  const slider = document.getElementById('create-tempo-slider');

  if (input) input.value = tempo;
  if (slider) slider.value = tempo;

  document.querySelectorAll('.create-tempo-btn').forEach(function(btn) {
    btn.classList.toggle(
      'active',
      activeScale !== null &&
      Number(btn.dataset.scale) === activeScale
    );
  });

  if (typeof KernPlayer !== 'undefined') {
    KernPlayer.setTempo(tempo);
  }
}

function setCreateTempoScale(scale) {
  const baseTempo = 120;
  const tempo = Math.round(baseTempo * scale);

  setCreateTempo(tempo, scale);
}

function setCreateView(mode) {
  if (!['music', 'text', 'both'].includes(mode)) return;

  const editor = document.querySelector('.create-editor');

  if (!editor) return;

  editor.dataset.view = mode;

  document.querySelectorAll('.create-view-btn').forEach(function(btn) {
    const active = btn.dataset.view === mode;

    btn.classList.toggle('active', active);
    btn.setAttribute('aria-pressed', String(active));
  });
}

// Replace the original lyric tokens while preserving
// the musical data and Humdrum spine structure.
// Replace lyrics in a Humdrum phrase without changing notes.
function replacePhraseLyrics(originalKern, newLyrics) {
  const rows = originalKern.split(/\r?\n/);

  const headerIndex = rows.findIndex(row =>
    row.startsWith('**')
  );

  if (headerIndex === -1) {
    throw new Error('Humdrum header not found.');
  }

  const headerCols = rows[headerIndex].split('\t');

  if (!headerCols.includes('**text')) {
    throw new Error('No **text lyric spine found.');
  }

  // Track active spine types.
  let spines = headerCols.slice();

  const lyricPositions = [];
  const lyricCells = [];

  function isDataRow(cols) {
    return cols.length > 0 &&
      !cols[0].startsWith('*') &&
      !cols[0].startsWith('=');
  }

  // Scan lyric tracks and preserve spine structure.
  for (let i = headerIndex + 1; i < rows.length; i++) {
    const row = rows[i];

    if (!row || row.startsWith('!')) {
      continue;
    }

    const cols = row.split('\t');

    if (cols.length !== spines.length) {
      throw new Error(
        'Spine count mismatch at line ' + (i + 1)
      );
    }

    if (cols.every(token => token.startsWith('*'))) {
      if (cols.some(token =>
        token === '*v' ||
        token === '*x' ||
        token === '*+'
      )) {
        throw new Error(
          'Unsupported spine operation at line ' + (i + 1)
        );
      }

      const nextSpines = [];

      cols.forEach((token, index) => {
        if (token === '*^') {
          nextSpines.push(
            spines[index],
            spines[index]
          );
        } else if (token !== '*-') {
          nextSpines.push(spines[index]);
        }
      });

      spines = nextSpines;
      continue;
    }

    if (!isDataRow(cols)) {
      continue;
    }

    const firstTextIndex = spines.indexOf('**text');

    if (firstTextIndex === -1) {
      continue;
    }

    // Store every non-null lyric location so that
    // original lyrics from all verses can be cleared.
    cols.forEach((token, column) => {
      if (
        spines[column] === '**text' &&
        token !== '.'
      ) {
        lyricCells.push({
          rowIndex: i,
          colIndex: column
        });
      }
    });

    // Use the first lyric spine for the new lyrics.
    // Existing non-null tokens define available slots.
    if (cols[firstTextIndex] !== '.') {
      lyricPositions.push({
        rowIndex: i,
        colIndex: firstTextIndex
      });
    }
  }

  const newTokens = newLyrics
    .trim()
    .split(/\s+/)
    .filter(Boolean);

  if (
    newTokens.length > 0 &&
    lyricPositions.length === 0
  ) {
    throw new Error(
      'No lyric positions available in this phrase.'
    );
  }

  if (newTokens.length > lyricPositions.length) {
    throw new Error(
      'You entered ' + newTokens.length +
      ' lyric units, but this phrase has only ' +
      lyricPositions.length +
      ' positions. Please adjust the lyrics.'
    );
  }

  // Clear all original lyric tokens.
  lyricCells.forEach(position => {
    const cols = rows[position.rowIndex].split('\t');

    cols[position.colIndex] = '.';

    rows[position.rowIndex] = cols.join('\t');
  });

  // Insert the user's new lyrics.
  lyricPositions.forEach((position, index) => {
    if (index >= newTokens.length) {
      return;
    }

    const cols = rows[position.rowIndex].split('\t');

    cols[position.colIndex] = newTokens[index];

    rows[position.rowIndex] = cols.join('\t');
  });

  return rows.join('\n');
}

// Export Create compositions with user lyrics in the score.
(function () {

  const escapeHtml = value =>
    String(value).replace(/[&<>"']/g, char => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[char]));

  // Render modified Humdrum in a temporary area.
  function renderExportScore(kern, index) {
    return new Promise((resolve, reject) => {

      const container = document.createElement('div');
      container.style.cssText =
        'position:absolute;left:-100000px;top:0;' +
        'width:900px;visibility:hidden;pointer-events:none;';

      const source = document.createElement('script');
      source.type = 'text/x-humdrum';
      source.id = 'create-export-score-' + index;
      source.textContent = kern;

      container.appendChild(source);
      document.body.appendChild(container);

      let finished = false;
      let observer;
      let timeout;

      function finish(error, svg) {
        if (finished) return;
        finished = true;

        if (observer) observer.disconnect();
        clearTimeout(timeout);

        const output = svg ? svg.outerHTML : null;
        container.remove();

        if (error) reject(error);
        else resolve(output);
      }

      function checkScore() {
    const svg = [...container.querySelectorAll('svg')]
    .find(el =>
      el.querySelector('defs') &&
      el.querySelector('style') &&
      el.querySelector('.note')
    );

    if (svg) finish(null, svg);
}

      observer = new MutationObserver(checkScore);

      observer.observe(container, {
        childList: true,
        subtree: true
      });

      timeout = setTimeout(() => {
        finish(new Error(
          'Verovio rendering timed out for Phrase ' +
          (index + 1)
        ));
      }, 20000);

      try {
        displayHumdrum({ source: source.id });
        checkScore();
      } catch (error) {
        finish(error);
      }
    });
  }

  async function exportCreatePdf() {
    const button =
      document.getElementById('create-save-pdf');

    const scores = Array.from(
      document.querySelectorAll('.create-line-block')
    );

    if (!scores.length ||
        scores.some(block =>
          !block.querySelector('.create-line-music svg .note')
        )) {
      alert('Please wait until all scores have loaded.');
      return;
    }

    // Open immediately to avoid popup blockers.
    const printWindow = window.open('', '_blank');

    if (!printWindow) {
      alert('Please allow pop-ups to export the PDF.');
      return;
    }

    printWindow.document.body.textContent =
      'Preparing your score...';

    if (button) {
      button.disabled = true;
      button.textContent = '⏳ Preparing PDF...';
    }

    try {
      const originalTitle =
        document.getElementById('create-title')
          ?.textContent || 'Song';

      const customTitle =
        document.getElementById('create-user-title')
          ?.value.trim();

      const title = customTitle || originalTitle;

      const composer =
        document.getElementById('create-composer')
          ?.textContent || '';

      const songId =
        document.getElementById('create-song-id')
          ?.textContent || '';

      const printable = [];

      for (let index = 0; index < scores.length; index++) {
        const block = scores[index];

        const lyrics =
          block.querySelector('.create-line-input')
            ?.value.trim() || '';

        let svgHtml;

        if (lyrics) {
          const originalKern =
            block.dataset.originalKern;

          if (!originalKern) {
            throw new Error(
              'Original Humdrum missing for Phrase ' +
              (index + 1)
            );
          }

          let modifiedKern;

          try {
            modifiedKern = replacePhraseLyrics(
              originalKern,
              lyrics
            );
          } catch (error) {
            throw new Error(
              'Phrase ' + (index + 1) +
              ': ' + error.message
            );
          }

          svgHtml = await renderExportScore(
            modifiedKern,
            index
          );

        } else {
          const selectedScore = block.querySelector('.create-score-version[data-score="original"]');
          const originalSvg = [
    ...(selectedScore ? selectedScore.querySelectorAll('svg') : [])
          ].find(svg =>
    svg.querySelector('defs') &&
    svg.querySelector('style') &&
    svg.querySelector('.note')
          );

          if (!originalSvg) {
            throw new Error(
              'Original score missing for Phrase ' +
              (index + 1)
            );
          }

          svgHtml = originalSvg.outerHTML;
        }

        printable.push(`
          <section class="phrase">
            <h2>Phrase ${index + 1}</h2>
            <div class="score">${svgHtml}</div>
          </section>
        `);
      }

      const html = `
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <title>${escapeHtml(title)}</title>
          <style>
            @page {
              size: A4;
              margin: 12mm;
            }

            body {
              font-family: Arial, sans-serif;
              color: #222;
              margin: 0;
            }

            h1 {
              text-align: center;
              font-size: 24px;
              margin: 0 0 8px;
            }

            .metadata {
              text-align: center;
              color: #666;
              font-size: 12px;
              margin-bottom: 22px;
            }

            .phrase {
              break-inside: avoid;
              page-break-inside: avoid;
              margin-bottom: 18px;
            }

            h2 {
              font-size: 14px;
              margin: 0 0 8px;
            }

            .score svg {
              display: block;
              width: 100%;
              height: auto;
              max-width: 100%;
            }
          </style>
        </head>
        <body>
          <h1>${escapeHtml(title)}</h1>
          <div class="metadata">
            ${escapeHtml(composer)}
            · ${escapeHtml(songId)}
            <div>
              Based on: ${escapeHtml(originalTitle)}
            </div>
          </div>

          ${printable.join('')}
        </body>
        </html>
      `;

      printWindow.document.open();
      printWindow.document.write(html);
      printWindow.document.close();

      // Print once the document and SVGs are laid out.
      await new Promise(resolve => {
        if (printWindow.document.readyState === 'complete') {
          resolve();
        } else {
          printWindow.addEventListener('load', resolve, {
            once: true
          });
        }
      });

      await printWindow.document.fonts.ready;

      printWindow.focus();
      printWindow.print();

    } catch (error) {
      console.error('Create PDF export failed:', error);

      if (!printWindow.closed) {
        printWindow.close();
      }

      alert(
        'PDF export failed: ' + error.message
      );

    } finally {
      if (button) {
        button.disabled = false;

        button.textContent =
          window.LANG === 'fr'
            ? '📄 Enregistrer en PDF'
            : '📄 Save as PDF';
      }
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    const button =
      document.getElementById('create-save-pdf');

    if (!button) return;

    button.textContent =
      window.LANG === 'fr'
        ? '📄 Enregistrer en PDF'
        : '📄 Save as PDF';

    button.addEventListener('click', exportCreatePdf);
  });

})();

</script>
