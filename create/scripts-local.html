<script>

function extractKernSegments(kern) {
  const rows = kern.split(/\r?\n/);
  const segments = [];

  let current = [];
  let inside = false;

  rows.forEach(function(row) {
    if (!row) return;

    const cols = row.split('\t');
    const melody = cols[0];

    if (!melody) return;

    if (melody.includes('{')) {
      inside = true;
      current = [];
    }

    if (inside) {
      current.push(row);
    }

    if (melody.includes('}') && inside) {
      segments.push(current.join('\n'));
      current = [];
      inside = false;
    }
  });

  return segments;
}


function extractKernHeader(kern) {
  const rows = kern.split(/\r?\n/);
  const header = [];

  for (const row of rows) {
    if (!row) continue;

    const cols = row.split('\t');
    const melody = cols[0];

    if (!melody) continue;

    if (melody.includes('{')) {
      break;
    }

    if (
      melody.startsWith('**') ||
      melody.startsWith('*') ||
      melody.startsWith('!')
    ) {
      header.push(row);
    }
  }

  return header;
}

function buildMiniKern(headerLines, segmentText) {
  const segmentRows = segmentText.split(/\r?\n/);

  // Determine the number of active spines
  // at the end of this phrase.
  const lastSpineRow = [...segmentRows]
    .reverse()
    .find(function(row) {
      return row.trim() &&
        !row.startsWith('!!') &&
        !row.startsWith('!');
    });

  let spineCount = 1;

  if (lastSpineRow) {
    spineCount = lastSpineRow.split('\t').length;
  } else {
    const header = headerLines.find(function(row) {
      return row.startsWith('**');
    });

    if (header) {
      spineCount = header.split('\t').length;
    }
  }

  const terminator = Array(spineCount)
    .fill('*-')
    .join('\t');

  return [
    ...headerLines,
    ...segmentRows,
    terminator
  ].join('\n');
}

let CREATE_TEMPO = 120;

function setCreateTempo(value) {
  const tempo = Math.max(40, Math.min(240, Number(value) || 120));

  CREATE_TEMPO = tempo;

  const input = document.getElementById('create-tempo-input');

  if (input) {
    input.value = tempo;
  }

  if (typeof KernPlayer !== 'undefined') {
    KernPlayer.setTempo(tempo);
  }
}

// Temporary playback function.
// For now this only confirms that the correct phrase KERN is selected.
function playCreatePhrase(kern, button) {

  if (!kern) {
    console.error('No KERN data available for this phrase.');
    return;
  }

  if (typeof KernPlayer === 'undefined') {
    console.error('KernPlayer is not available.');
    return;
  }

  const kpBtn =
    document.getElementById('audiobutton-play');

  if (!kpBtn) {
    console.error('KernPlayer play button was not found.');
    return;
  }


  // Stop anything currently playing.
  KernPlayer.stop();


  // Load only this phrase.
  KernPlayer.load(kern);

  // Apply the tempo selected on the Create page.
  KernPlayer.setTempo(CREATE_TEMPO);


  console.log(
    'Playing Phrase ' +
    (Number(button.dataset.line) + 1)
  );


  // Start playback through KernPlayer's hidden button.
  setTimeout(function() {

    kpBtn.click();

  }, 100);

}

document.addEventListener('DOMContentLoaded', function() {

  const tempoInput =
  document.getElementById('create-tempo-input');

if (tempoInput) {
  tempoInput.addEventListener('input', function() {
    setCreateTempo(this.value);
  });

  setCreateTempo(tempoInput.value);
}

  const params = new URLSearchParams(window.location.search);
  const songId = params.get('song');

  const singLink =
  document.getElementById('create-sing-link');

  const chansonLink =
  document.getElementById('create-chanson-link');

  const songIdEl =
    document.getElementById('create-song-id');

  const titleEl =
    document.getElementById('create-title');

  const composerEl =
    document.getElementById('create-composer');

  const linesEl =
    document.getElementById('create-lines');


  if (singLink && songId) {
  singLink.href =
    '/sing/#' + encodeURIComponent(songId);
  }

  if (chansonLink && songId) {
  chansonLink.href =
    '/work/?id=' + encodeURIComponent(songId);
  }


  if (!songId) {
    songIdEl.textContent =
      'No song selected';

    return;
  }


  const work = CREATE_WORKS.find(function(w) {
    return w['!!!id'] === songId;
  });


  if (!work) {
    songIdEl.textContent = songId;
    titleEl.textContent = 'Song not found';

    return;
  }


  songIdEl.textContent = songId;


  const originalTitle =
    work['!!!OTL@@FR'] || 'Untitled';


  titleEl.textContent =
    originalTitle;

  composerEl.textContent =
    work['!!!COM'] || '';


  const originalTitleEl =
    document.getElementById(
      'create-original-title'
    );


  if (originalTitleEl) {
    originalTitleEl.textContent =
      originalTitle;
  }


  const filename =
    work['!!!file-name'] || '';

  const prefix =
    songId.substring(0, 2).toUpperCase();

  const dir =
    prefix === 'BC' ? 'bc' : 'eg';


  if (!filename) {
    linesEl.textContent =
      'Lyrics unavailable.';

    return;
  }


  const baseUrl =
    'https://raw.githubusercontent.com/chanson-project/chanson-encoding/refs/heads/main/';


  const kernUrl =
    baseUrl +
    dir +
    '/kern/' +
    filename;


  fetch(kernUrl)

    .then(function(response) {

      if (!response.ok) {
        throw new Error(
          'KERN HTTP ' + response.status
        );
      }

      return response.text();
    })


    .then(function(kern) {

      const phraseSegments =
        extractKernSegments(kern);


      const hasPhraseMarkers =
        phraseSegments.length > 0;


      const segments =
        hasPhraseMarkers
          ? phraseSegments
          : [kern];


      const phraseKerns = [];


      const headerLines =
        hasPhraseMarkers
          ? extractKernHeader(kern)
          : [];


      console.log(
        hasPhraseMarkers
          ? 'Using Humdrum phrase markers.'
          : 'No phrase markers found; using complete KERN file.'
      );


      console.log(
        'SEGMENTS:',
        segments
      );

      console.log(
        'SEGMENT COUNT:',
        segments.length
      );


      // Clear "Loading song..."
      linesEl.innerHTML = '';


      // ---------------------------------------
      // Create one editor block for each phrase
      // ---------------------------------------

      segments.forEach(function(
        segment,
        index
      ) {

        const lineBlock =
          document.createElement('div');

        lineBlock.className =
          'create-line-block';


        // Phrase heading
        const header =
          document.createElement('div');

        header.className =
          'create-line-header';


        const headingText =
          document.createElement('span');

        headingText.textContent =
          'Phrase ' + (index + 1);


        // Play button
        const playButton =
          document.createElement('button');

        playButton.type =
          'button';

        playButton.className =
          'create-phrase-play';

        playButton.innerHTML =
          '▶ Play';

        playButton.dataset.line =
          index;


        header.appendChild(
          headingText
        );

        header.appendChild(
          playButton
        );


        // Music area
        const music =
          document.createElement('div');

        music.className =
          'create-line-music';

        music.dataset.line =
          index;


        // User lyric area
        const inputWrap =
          document.createElement('div');

        inputWrap.className =
          'create-input-line';


        const input =
          document.createElement('input');

        input.type =
          'text';

        input.className =
          'create-line-input';

        input.placeholder =
          'Write your own lyric for this phrase...';

        input.dataset.line =
          index;


        inputWrap.appendChild(
          input
        );


        lineBlock.appendChild(
          header
        );

        lineBlock.appendChild(
          music
        );

        lineBlock.appendChild(
          inputWrap
        );


        linesEl.appendChild(
          lineBlock
        );

      });


      // ---------------------------------------
      // Build and render score for each phrase
      // ---------------------------------------

      segments.forEach(function(
        segment,
        index
      ) {

        const musicBox =
          document.querySelector(
            '.create-line-music[data-line="' +
            index +
            '"]'
          );


        if (!musicBox) {

          console.warn(
            'No lyric line exists for music segment ' +
            index
          );

          return;
        }


        const firstDataRow = segment
  .split(/\r?\n/)
  .find(row =>
    row.trim() &&
    !row.startsWith('!')
  );

const initialHeader = headerLines.find(
  row => row.startsWith('**')
);

const initialSpines = initialHeader
  ? initialHeader.split('\t').length
  : 0;

const phraseSpines = firstDataRow
  ? firstDataRow.split('\t').length
  : 0;

let miniKern = hasPhraseMarkers
  ? buildMiniKern(headerLines, segment)
  : segment;

// Restore the missing split for phrases that
// begin with six spines after a five-spine header.
if (
  hasPhraseMarkers &&
  initialSpines === 5 &&
  phraseSpines === 6
) {
  const rows = miniKern.split(/\r?\n/);

  const insertionPoint = rows.findIndex(row =>
    row === firstDataRow
  );

  if (insertionPoint !== -1) {
    rows.splice(
      insertionPoint,
      0,
      '*^\t*\t*\t*\t*'
    );

    miniKern = rows.join('\n');
  }
}


        // Save phrase KERN for playback
        phraseKerns[index] =
          miniKern;


        console.log(
          'SCORE FOR LINE ' +
          (index + 1) +
          ':'
        );

        console.log(
          miniKern
        );


        const scoreSource =
          document.createElement(
            'script'
          );


        scoreSource.type =
          'text/x-humdrum';


        scoreSource.id =
          'create-score-' + index;


        scoreSource.textContent =
          miniKern;


        musicBox.innerHTML =
          '';


        musicBox.appendChild(
          scoreSource
        );


        if (
          typeof displayHumdrum ===
          'function'
        ) {

          displayHumdrum({
            source:
              scoreSource.id
          });

        } else {

          console.error(
            'displayHumdrum is not available.'
          );

        }

      });


      // ---------------------------------------
      // Add Play button listeners
      // ---------------------------------------

      document
        .querySelectorAll(
          '.create-phrase-play'
        )
        .forEach(function(button) {

          button.addEventListener(
            'click',
            function() {

              const index =
                Number(
                  button.dataset.line
                );


              console.log(
                'PLAY PHRASE ' +
                (index + 1)
              );


              console.log(
                phraseKerns[index]
              );


              playCreatePhrase(
                phraseKerns[index],
                button
              );

            }
          );

        });

    })


    .catch(function(error) {

      console.error(
        'Could not load song:',
        error
      );


      linesEl.textContent =
        'Song data unavailable.';

    });

});

// Export the complete Create composition through
// the browser's native Save as PDF dialog.
(function () {
  function exportCreatePdf() {
    const scores = Array.from(
      document.querySelectorAll('.create-line-block')
    );

    if (
      !scores.length ||
      scores.some(block => !block.querySelector('.create-line-music svg'))
    ) {
      alert('Please wait until all scores have loaded.');
      return;
    }

    const originalTitle =
      document.getElementById('create-title')?.textContent || 'Song';

    const customTitle =
      document.getElementById('create-user-title')?.value.trim();

    const title = customTitle || originalTitle;

    const composer =
      document.getElementById('create-composer')?.textContent || '';

    const songId =
      document.getElementById('create-song-id')?.textContent || '';

    const escapeHtml = value =>
      String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));

    const printablePhrases = scores.map((block, index) => {
      const score = block.querySelector('.create-line-music svg');
      const lyrics =
        block.querySelector('.create-line-input')?.value.trim() || '';

      return `
        <section class="phrase">
          <h2>Phrase ${index + 1}</h2>
          <div class="score">${score.outerHTML}</div>
          ${lyrics
            ? `<div class="lyrics">${escapeHtml(lyrics)}</div>`
            : ''}
        </section>
      `;
    }).join('');

    const html = `
      <!DOCTYPE html>
      <html>
      <head>
        <meta charset="UTF-8">
        <title>${escapeHtml(title)}</title>
        <style>
          @page {
            size: A4;
            margin: 15mm;
          }

          body {
            font-family: Arial, sans-serif;
            color: #222;
          }

          h1 {
            text-align: center;
            margin-bottom: 6px;
          }

          .metadata {
            text-align: center;
            color: #666;
            margin-bottom: 24px;
          }

          .phrase {
            break-inside: avoid;
            page-break-inside: avoid;
            margin-bottom: 24px;
          }

          h2 {
            font-size: 14px;
          }

          .score svg {
            display: block;
            width: 100%;
            height: auto;
          }

          .lyrics {
            margin-top: 12px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-size: 12px;
            line-height: 1.6;
          }
        </style>
      </head>
      <body>
        <h1>${escapeHtml(title)}</h1>
        <div class="metadata">
          ${escapeHtml(composer)} · ${escapeHtml(songId)}
        </div>
        ${printablePhrases}
      </body>
      </html>
    `;

    const printWindow = window.open('', '_blank');

    if (!printWindow) {
      alert('Please allow pop-ups to export the PDF.');
      return;
    }

    printWindow.document.open();
    printWindow.document.write(html);
    printWindow.document.close();

    printWindow.onload = function () {
      // Give the browser time to lay out SVG scores.
      setTimeout(() => {
        printWindow.focus();
        printWindow.print();
      }, 500);
    };
  }

  document.addEventListener('DOMContentLoaded', function () {
    const button = document.getElementById('create-save-pdf');
    if (!button) return;

    button.textContent =
      window.LANG === 'fr'
        ? '📄 Enregistrer en PDF'
        : '📄 Save as PDF';

    button.addEventListener('click', exportCreatePdf);
  });
})();

</script>
