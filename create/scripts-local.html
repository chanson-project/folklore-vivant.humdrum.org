<script>

function extractKernSegments(kern) {
  const rows = kern.split(/\r?\n/);
  const segments = [];

  let current = [];
  let inside = false;

  rows.forEach(function(row) {
    if (!row) return;

    const cols = row.split('\t');
    const melody = cols[0];

    if (!melody) return;

    if (melody.includes('{')) {
      inside = true;
      current = [];
    }

    if (inside) {
      current.push(row);
    }

    if (melody.includes('}') && inside) {
      segments.push(current.join('\n'));
      current = [];
      inside = false;
    }
  });

  return segments;
}

function extractKernHeader(kern) {
  const rows = kern.split(/\r?\n/);
  const header = [];

  for (const row of rows) {
    if (!row) continue;

    const cols = row.split('\t');
    const melody = cols[0];

    if (!melody) continue;

    if (melody.includes('{')) {
      break;
    }

    if (
      melody.startsWith('**') ||
      melody.startsWith('*') ||
      melody.startsWith('!')
    ) {
      header.push(melody);
    }
  }

  return header;
}

function buildMiniKern(headerLines, segmentText) {
  const segmentRows = segmentText.split(/\r?\n/).map(function(row) {
    return row.split('\t')[0]; 
  });

  return [
    ...headerLines,
    ...segmentRows,
    '*-'
  ].join('\n');
}

document.addEventListener('DOMContentLoaded', function() {
  const params = new URLSearchParams(window.location.search);
  const songId = params.get('song');

  const backLink = document.getElementById('create-back-link');

  if (backLink && songId) {
    backLink.href = '/sing/#' + encodeURIComponent(songId);
  }

  const songIdEl = document.getElementById('create-song-id');
  const titleEl = document.getElementById('create-title');
  const composerEl = document.getElementById('create-composer');
  const lyricsEl = document.getElementById('create-lines');

  if (!songId) {
    songIdEl.textContent = 'No song selected';
    return;
  }

  const work = CREATE_WORKS.find(function(w) {
    return w['!!!id'] === songId;
  });

  if (!work) {
    songIdEl.textContent = songId;
    titleEl.textContent = 'Song not found';
    return;
  }

  songIdEl.textContent = songId;
  titleEl.textContent = work['!!!OTL@@FR'] || 'Untitled';
  composerEl.textContent = work['!!!COM'] || '';

  const filename = work['!!!file-name'] || '';
  const prefix = songId.substring(0, 2).toUpperCase();
  const dir = prefix === 'BC' ? 'bc' : 'eg';

  if (!filename) {
    lyricsEl.textContent = 'Lyrics unavailable.';
    return;
  }

  const textFilename = filename.replace(/\.krn$/, '.txt');

  const textUrl =
    'https://raw.githubusercontent.com/chanson-project/chanson-encoding/refs/heads/main/' +
    dir +
    '/text/' +
    textFilename;

    const kernUrl =
  'https://raw.githubusercontent.com/chanson-project/chanson-encoding/refs/heads/main/' +
  dir +
  '/kern/' +
  filename;

  fetch(textUrl)
    .then(function(response) {
      if (!response.ok) {
        throw new Error(response.status);
      }

      return response.text();
    })
    .then(function(text) {
      const lyrics = text.trim();
      const lines = lyrics.split(/\r?\n/);

      const linesEl = document.getElementById('create-lines');

linesEl.innerHTML = '';

lines.forEach(function(line, index) {

  const lineBlock = document.createElement('div');
  lineBlock.className = 'create-line-block';

  // Line heading
  const header = document.createElement('div');
  header.className = 'create-line-header';
  header.textContent = 'Line ' + (index + 1);

  // Music area — we will populate this later from {...} segments
  const music = document.createElement('div');
  music.className = 'create-line-music';
  music.dataset.line = index;

  // Original lyrics
  const originalLine = document.createElement('div');
  originalLine.className = 'create-original-line';
  originalLine.textContent = line || ' ';

  // User's version
  const inputWrap = document.createElement('div');
  inputWrap.className = 'create-input-line';

  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'create-line-input';
  input.placeholder = line ? 'Try your own words...' : '';
  input.dataset.line = index;

  inputWrap.appendChild(input);

  lineBlock.appendChild(header);
  lineBlock.appendChild(music);
  lineBlock.appendChild(originalLine);
  lineBlock.appendChild(inputWrap);

  linesEl.appendChild(lineBlock);
});
    })
        .catch(function(error) {
      console.error('Could not load lyrics:', error);
      lyricsEl.textContent = 'Lyrics unavailable.';
    });

  fetch(kernUrl)
    .then(function(response) {
      if (!response.ok) {
        throw new Error(response.status);
      }

      return response.text();
    })
    .then(function(kern) {
  const segments = extractKernSegments(kern);

  console.log('KERN FILE:', kern);
  console.log('SEGMENTS:', segments);
  console.log('SEGMENT COUNT:', segments.length);

  if (segments.length === 0) {
    console.error('No melody segments found.');
    return;
  }

  const headerLines = extractKernHeader(kern);
  const firstSegmentKern = buildMiniKern(headerLines, segments[0]);

  console.log('FIRST SEGMENT KERN:');
  console.log(firstSegmentKern);

  const testScore = document.getElementById('create-score-test');

  if (testScore) {
    testScore.textContent = firstSegmentKern;

    if (typeof displayHumdrum === 'function') {
      displayHumdrum({
  source: 'create-score-test'
});
    } else {
      console.error('displayHumdrum is not available.');
    }
  }
})
    .catch(function(error) {
      console.error('Could not load kern:', error);
    });

});

</script>
