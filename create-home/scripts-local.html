<script>

document.addEventListener('DOMContentLoaded', function() {

  const grid =
    document.getElementById('create-home-grid');

  const search =
    document.getElementById('create-home-search');

  const count =
    document.getElementById('create-home-count');

  if (!grid) return;


  function renderCreateSongs(works) {

    grid.innerHTML = '';

    if (count) {
      count.textContent =
        works.length + ' songs';
    }


    works.forEach(function(work) {

      const id =
        work['!!!id'] || '';

      const title =
        work['!!!OTL@@FR'] || 'Untitled';

      const composer =
        work['!!!COM'] || '';

      const card =
        document.createElement('a');

      card.className =
        'create-home-card';

      card.href =
        '/create/?song=' +
        encodeURIComponent(id);

      card.innerHTML = `
        <div class="create-home-card-id">
          ${id}
        </div>

        <div class="create-home-card-icon">
          ✨
        </div>

        <div class="create-home-card-title">
          ${title}
        </div>

        <div class="create-home-card-composer">
          ${composer}
        </div>

        <div class="create-home-card-action">
          Create →
        </div>
      `;

      grid.appendChild(card);

    });

  }


  renderCreateSongs(CREATE_HOME_WORKS);


  if (search) {

    search.addEventListener('input', function() {

      const query =
        this.value
          .trim()
          .toLowerCase();

      const filtered =
        CREATE_HOME_WORKS.filter(function(work) {

          const id =
            (work['!!!id'] || '')
              .toLowerCase();

          const title =
            (work['!!!OTL@@FR'] || '')
              .toLowerCase();

          const composer =
            (work['!!!COM'] || '')
              .toLowerCase();

          return (
            id.includes(query) ||
            title.includes(query) ||
            composer.includes(query)
          );

        });

      renderCreateSongs(filtered);

    });

  }

});

</script>
