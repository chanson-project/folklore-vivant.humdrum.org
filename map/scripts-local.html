<script>
/*
 * Explore Map (Canada) — v1
 * Data comes from the same Jekyll metadata include used elsewhere on the site.
 * Coordinates below are representative place locations, NOT recording sites.
 * Add locations only after verifying them with an authoritative gazetteer.
 */
(function () {
  'use strict';

  const WORKS = {% include metadata/works.json %};
  const FIELD = {
    id: {{ site.fields.works.id | jsonify }},
    title: {{ site.fields.works.title | jsonify }},
    origin: {{ site.fields.works.origin | jsonify }}
  };
  const WORK_URL = {{ '/work/' | relative_url | jsonify }};

  // Representative coordinates from Canadian geographical-name records.
  // Keys are "normalized locality|normalized province".
  const VERIFIED_LOCATIONS = {
    'eboulements|quebec': { name: 'Les Éboulements', province: 'Québec', lat: 47.479816, lng: -70.317843 },
    'les eboulements|quebec': { name: 'Les Éboulements', province: 'Québec', lat: 47.479816, lng: -70.317843 },
    'port daniel|quebec': { name: 'Port-Daniel', province: 'Québec', lat: 48.179502, lng: -64.970588 },
    'tadoussac|quebec': { name: 'Tadoussac', province: 'Québec', lat: 48.150000, lng: -69.716667 },
    'beauharnois|quebec': { name: 'Beauharnois', province: 'Québec', lat: 45.294300, lng: -73.884540 },
    'saint irenee|quebec': { name: 'Saint-Irénée', province: 'Québec', lat: 47.570556, lng: -70.208056 },
    'roberval|quebec': { name: 'Roberval', province: 'Québec', lat: 48.517771, lng: -72.221996 },
    'temiscouata|quebec': { name: 'Témiscouata', province: 'Québec', lat: 47.683333, lng: -68.883333 },
    // Additional CGNDB locations (official representative geographical points; not recording coordinates).
    // Gaspé: https://geonames.nrcan.gc.ca/search-place-names/unique?id=EGLSD
    'gaspe|quebec': { name: 'Gaspé', province: 'Québec', lat: 48.824618, lng: -64.476254 },
    // Île d'Orléans: https://geonames.nrcan.gc.ca/search-place-names/unique?id=EHMJE
    'ile d orleans|quebec': { name: 'Île d’Orléans', province: 'Québec', lat: 46.935916, lng: -70.947271 },
    // Saint-Antonin: https://geonames.nrcan.gc.ca/search-place-names/unique?id=ESJGI
    'saint antonin|quebec': { name: 'Saint-Antonin', province: 'Québec', lat: 47.7666667, lng: -69.4833333 },
    // v3: representative locality coordinates, not exact recording sites.
    // La Tourelle is now part of Sainte-Anne-des-Monts; representative point in the Tourelle village area:
    // https://toponymie.gouv.qc.ca/ct/ToposWeb/Fiche.aspx?no_seq=439469
    'la tourelle|quebec': { name: 'Tourelle (Gaspésie)', province: 'Québec', lat: 49.15551, lng: -66.41843 },
    // https://geonames.nrcan.gc.ca/search-place-names/unique?id=EMGWI
    'kamouraska|quebec': { name: 'Kamouraska', province: 'Québec', lat: 47.56618, lng: -69.86791 },
    // https://geonames.nrcan.gc.ca/search-place-names/unique?id=ESBFE
    'notre dame du portage|quebec': { name: 'Notre-Dame-du-Portage', province: 'Québec', lat: 47.765619, lng: -69.6098 },
    // Historic Berthier-en-Haut = Berthierville: https://toponymie.gouv.qc.ca/ct/ToposWeb/Fiche.aspx?no_seq=5375
    // https://geonames.nrcan.gc.ca/search-place-names/unique?id=EFNEP
    'berthier en haut|quebec': { name: 'Berthierville (Berthier-en-Haut)', province: 'Québec', lat: 46.083899, lng: -73.175688 },
    // https://geonames.nrcan.gc.ca/search-place-names/unique?id=EGZSK
    'levis|quebec': { name: 'Lévis', province: 'Québec', lat: 46.758172, lng: -71.240366 },
    // https://toponymie.gouv.qc.ca/ct/ToposWeb/Fiche.aspx?no_seq=42055
    'mont carmel|quebec': { name: 'Mont-Carmel (Kamouraska)', province: 'Québec', lat: 47.4417, lng: -69.85542 },
    // Historical Argentenay near the NE tip of Île d'Orléans; pin at Pointe Argentenay:
    // https://toponymie.gouv.qc.ca/ct/ToposWeb/fiche.aspx?no_seq=1966
    'argentenay|quebec': { name: 'Argentenay (Île d’Orléans)', province: 'Québec', lat: 47.02446, lng: -70.79863 },
    // https://geonames.nrcan.gc.ca/search-place-names/unique?id=EMAOT
    'baie saint paul|quebec': { name: 'Baie-Saint-Paul', province: 'Québec', lat: 47.4413889, lng: -70.5075 },
    // https://geonames.nrcan.gc.ca/search-place-names/unique?id=DAHFF
    'coal branch|new brunswick': { name: 'Coal Branch', province: 'New Brunswick', lat: 46.355612, lng: -65.149533 },
    // https://geonames.nrcan.gc.ca/search-place-names/unique?id=DADHJ
    'moncton|new brunswick': { name: 'Moncton', province: 'New Brunswick', lat: 46.099479, lng: -64.799802 },
    // https://geonames.nrcan.gc.ca/search-place-names/unique?id=EQXNR
    'saint anne des monts|quebec': { name: 'Sainte-Anne-des-Monts', province: 'Québec', lat: 49.13001, lng: -66.487669 },
    // https://geonames.nrcan.gc.ca/search-place-names/unique?id=DAEBL
    'saint antoine|new brunswick': { name: 'Saint-Antoine (Kent)', province: 'New Brunswick', lat: 46.362864, lng: -64.752638 },
    // https://toponymie.gouv.qc.ca/ct/ToposWeb/fiche.aspx?no_seq=56297
    'sainte marie de beauce|quebec': { name: 'Sainte-Marie (Beauce)', province: 'Québec', lat: 46.43838, lng: -71.02131 },
    // https://geonames.nrcan.gc.ca/search-place-names/unique?id=EHZYW
    'saint hilarion|quebec': { name: 'Saint-Hilarion (Charlevoix)', province: 'Québec', lat: 47.578549, lng: -70.402019 }
  };

  function normalize(value) {
    return String(value || '').normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, ' ')
      .trim().replace(/\s+/g, ' ');
  }

  function resolvePlace(raw) {
    const parts = String(raw || '').split(',').map(normalize).filter(Boolean);
    // Accept town, province[, Canada] and town, region, province, Canada.
    // Do not guess a province from the second comma-delimited segment.
    if (parts.length < 2) return null;
    const provinces = {
      'quebec': 'quebec', 'qc': 'quebec', 'province de quebec': 'quebec',
      'new brunswick': 'new brunswick', 'nouveau brunswick': 'new brunswick',
      'nb': 'new brunswick'
    };
    const withoutCountry = parts[parts.length - 1] === 'canada'
      ? parts.slice(0, -1) : parts;
    if (withoutCountry.length < 2) return null;
    const province = provinces[withoutCountry[withoutCountry.length - 1]];
    if (!province) return null;
    // First component is a locality, not a region or recording location.
    return VERIFIED_LOCATIONS[`${withoutCountry[0]}|${province}`] || null;
  }

  const isFrench = () => window.LANG === 'fr';
  const tr = (en, fr) => isFrench() ? fr : en;
  const mapElement = document.getElementById('canada-song-map');
  const summary = document.getElementById('song-map-summary');
  const collectionSelect = document.getElementById('song-map-collection');
  const searchInput = document.getElementById('song-map-search');
  const resetButton = document.getElementById('song-map-reset');
  const focusButton = document.getElementById('song-map-focus');
  if (!mapElement || !summary) return;
  if (typeof L === 'undefined') {
    summary.textContent = tr('The map library did not load. Check your connection.', 'La bibliothèque de cartes ne s’est pas chargée. Vérifiez votre connexion.');
    return;
  }

  const records = [];
  let skippedNoPlace = 0;
  let skippedUnmatched = 0;
  const unrecognizedPlaces = new Set();
  for (const entry of (Array.isArray(WORKS) ? WORKS : [])) {
    const id = String(entry[FIELD.id] || '').trim();
    const area = String(entry[FIELD.origin] || '').trim();
    if (!id || !area || /^(unknown|n\/a|na|none|inconnu|non renseigne)$/i.test(normalize(area))) {
      skippedNoPlace++;
      continue;
    }
    const place = resolvePlace(area);
    if (!place) {
      skippedUnmatched++;
      unrecognizedPlaces.add(area);
      continue;
    }
    const collection = (id.match(/^[a-z]+/i) || ['Other'])[0].toUpperCase();
    records.push({
      id: id,
      title: String(entry[FIELD.title] || id).trim(),
      area: area,
      collection: collection,
      place: place,
      searchText: normalize([id, entry[FIELD.title], area, collection].join(' '))
    });
  }

  // Useful when extending coverage: see the unmapped !ARE values in console.
  if (unrecognizedPlaces.size) {
    console.info('[Explore Map] Unmapped !!!ARE values:', [...unrecognizedPlaces].sort());
  }

  const allCollections = [...new Set(records.map(s => s.collection))].sort();
  for (const code of allCollections) {
    const opt = document.createElement('option');
    opt.value = code;
    opt.textContent = code;
    collectionSelect.appendChild(opt);
  }
  collectionSelect.options[0].textContent = tr('All collections', 'Toutes les collections');

  const map = L.map(mapElement, {
    minZoom: 3, maxZoom: 16,
    zoomControl: true,
    maxBounds: [[35, -155], [85, -43]],
    maxBoundsViscosity: 0.7
  });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19
  }).addTo(map);
  const CANADA_BOUNDS = L.latLngBounds([[42, -141], [76, -52]]);
  map.fitBounds(CANADA_BOUNDS, {padding: [12, 12]});

  // Marker clustering groups pins that overlap at national scale; graceful fallback.
  const markers = typeof L.markerClusterGroup === 'function'
    ? L.markerClusterGroup({ showCoverageOnHover: false, spiderfyOnMaxZoom: true, maxClusterRadius: 52 })
    : L.layerGroup();
  map.addLayer(markers);

  function makePin(count) {
    return L.divIcon({
      className: '',
      html: `<div class="song-map-pin"><span>${count}</span></div>`,
      iconSize: [38, 38], iconAnchor: [18, 37], popupAnchor: [0, -30]
    });
  }

  function createPopup(place, songs) {
    // Construct DOM safely: titles and locations come from editable metadata.
    const root = document.createElement('div');
    root.className = 'song-map-popup';
    const heading = document.createElement('h3');
    heading.textContent = `${place.name}, ${place.province}`;
    root.appendChild(heading);
    const description = document.createElement('p');
    description.textContent = tr(`${songs.length} song(s)`, `${songs.length} chanson(s)`);
    root.appendChild(description);
    const accuracy = document.createElement('p');
    accuracy.className = 'song-map-geography-note';
    accuracy.textContent = tr('Pin marks an approximate locality, not a recording address.', 'Le repère indique une localité approximative, pas l’adresse d’enregistrement.');
    root.appendChild(accuracy);
    const list = document.createElement('ul');
    list.className = 'song-map-songlist';
    for (const song of songs.slice().sort((a, b) => a.title.localeCompare(b.title))) {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = `${WORK_URL}?id=${encodeURIComponent(song.id)}`;
      a.textContent = song.title;
      const small = document.createElement('small');
      small.textContent = `${song.id} · ${song.collection}`;
      li.appendChild(a);
      li.appendChild(small);
      list.appendChild(li);
    }
    root.appendChild(list);
    return root;
  }

  let visibleBounds = null;
  function redraw() {
    markers.clearLayers();
    const query = normalize(searchInput.value);
    const tokens = query ? query.split(' ') : [];
    const selectedCollection = collectionSelect.value;
    const subset = records.filter(s =>
      (!selectedCollection || s.collection === selectedCollection) &&
      tokens.every(token => s.searchText.includes(token))
    );
    const grouped = new Map();
    for (const song of subset) {
      const key = `${song.place.lat},${song.place.lng}`;
      if (!grouped.has(key)) grouped.set(key, {place: song.place, songs: []});
      grouped.get(key).songs.push(song);
    }
    const coordinates = [];
    for (const group of grouped.values()) {
      const p = group.place;
      const marker = L.marker([p.lat, p.lng], {icon: makePin(group.songs.length)});
      marker.bindTooltip(`${p.name}, ${p.province}`);
      marker.bindPopup(createPopup(p, group.songs), {maxWidth: 330, minWidth: 210});
      markers.addLayer(marker);
      coordinates.push([p.lat, p.lng]);
    }
    visibleBounds = coordinates.length ? L.latLngBounds(coordinates) : null;
    summary.textContent = tr(
      `${subset.length} mapped song(s) across ${grouped.size} place(s) · ${skippedUnmatched + skippedNoPlace} other records not mapped`,
      `${subset.length} chanson(s) sur la carte dans ${grouped.size} lieu(x) · ${skippedUnmatched + skippedNoPlace} autres notices non cartographiées`
    );
    summary.classList.toggle('song-map-empty', subset.length === 0);
  }

  collectionSelect.addEventListener('change', redraw);
  searchInput.addEventListener('input', redraw);
  resetButton.addEventListener('click', () => {
    collectionSelect.value = '';
    searchInput.value = '';
    redraw();
    map.fitBounds(CANADA_BOUNDS, {padding: [12, 12]});
  });
  focusButton.addEventListener('click', () => {
    if (!visibleBounds) return;
    if (visibleBounds.getSouthWest().equals(visibleBounds.getNorthEast())) {
      map.setView(visibleBounds.getCenter(), 9);
    } else {
      map.fitBounds(visibleBounds.pad(0.20), {padding: [25, 25], maxZoom: 9});
    }
  });
  redraw();
})();
</script>
