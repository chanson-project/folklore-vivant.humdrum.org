name: Issue 24 Build Preview

on:
  push:
    branches: [issue-24-explore-map]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Prepare Metadata and Indexes
        run: |
          make download
          python3 -m json.tool _includes/metadata/works.json > /dev/null
          python3 -m json.tool _includes/metadata/sources.json > /dev/null
          make melodic-index
          make scans-index

      - name: Build Jekyll
        run: bundle exec jekyll build --trace

      - name: Upload Preview
        uses: actions/upload-artifact@v4
        with:
          name: issue24-site
          path: _site/
