//////////////////////////////
//
// extractHtmlBlock -- Parse a @@BEGIN:<blockName> / @@END:<blockName> ATON block
//    from Humdrum text (!! comment lines) and return the @CONTENT value as a
//    string, or null if the block is absent.  Works on both the raw kern source
//    and on the filtered humdrumOutput returned by Verovio after a filter run.
//

function extractHtmlBlock(humdrum, blockName) {
	const beginRe = new RegExp("^@@BEGIN:\\s*" + blockName + "\\s*$");
	const endRe   = new RegExp("^@@END:\\s*"   + blockName + "\\s*$");
	const lines = humdrum.split("\n");
	let inBlock   = false;
	let inContent = false;
	const htmlLines = [];
	for (let i = 0; i < lines.length; i++) {
		const line = lines[i];
		if (!line.startsWith("!!") || line.startsWith("!!!")) continue;
		const inner = line.slice(2);            // strip leading !!
		if (inner.match(beginRe))  { inBlock = true; continue; }
		if (inner.match(endRe))    { break; }
		if (!inBlock)              continue;
		if (inner.match(/^@CONTENT:/)) { inContent = true; continue; }
		if (inContent) {
			htmlLines.push(inner.startsWith(" ") ? inner.slice(1) : inner);
		}
	}
	return htmlLines.length ? htmlLines.join("\n") : null;
}


//////////////////////////////
//
// injectHtmlBlock -- Write html into div.POSTHTML (or div.PREHTML) and show it.
//    Pass null/empty to hide and clear the element.
//

function injectHtmlBlock(className, html) {
	const el = document.querySelector("div." + className);
	if (!el) return;
	if (html) {
		el.innerHTML = html;
		el.style.display = "block";
	} else {
		el.innerHTML = "";
		el.style.display = "none";
	}
}




//////////////////////////////
//
// _kernKey -- Extract key (tonic semitone + mode) from a kern string.
//    Looks for interpretations like *F: (F major) or *d: (d minor).
//    Kern uses '-' for flat, '#' for sharp.  Returns C major as default.
//

const _PITCH_SEMITONES = {
	C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11
};
const _MAJOR_DEGREES = {
	0:'1',1:'#1',2:'2',3:'b3',4:'3',5:'4',6:'#4',7:'5',8:'b6',9:'6',10:'b7',11:'7'
};
const _MINOR_DEGREES = {
	0:'1',1:'#1',2:'2',3:'3',4:'#3',5:'4',6:'#4',7:'5',8:'6',9:'#6',10:'7',11:'#7'
};

function _kernKey(kernText) {
	const base = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};
	for (const line of kernText.split('\n')) {
		if (!line.startsWith('*') || line.startsWith('**') || line.startsWith('*-')) continue;
		const m = line.split('\t')[0].match(/^\*([A-Ga-g])([#-]?):$/);
		if (!m) continue;
		const isMinor = m[1] !== m[1].toUpperCase();
		let tonic = base[m[1].toUpperCase()];
		if (m[2] === '#') tonic = (tonic + 1) % 12;
		if (m[2] === '-') tonic = (tonic + 11) % 12;
		return { tonic, isMinor };
	}
	return { tonic: 0, isMinor: false };
}


//////////////////////////////
//
// _pitchToDegree -- Convert a pitch-class string (e.g. 'F#', 'Bb') to a
//    scale-degree string (e.g. '#4', 'b7') given tonic semitone and mode.
//

function _pitchToDegree(pitch, tonic, isMinor) {
	const semitone = _PITCH_SEMITONES[pitch];
	if (semitone === undefined) return null;
	const interval = (semitone - tonic + 12) % 12;
	return (isMinor ? _MINOR_DEGREES : _MAJOR_DEGREES)[interval] || null;
}


//////////////////////////////
//
// markMelodicMatches -- Append '@' to kern note tokens that match the query,
//    and append an RDF colour declaration.  HNP/Verovio renders '@'-marked
//    notes in the highlight colour.
//
//    queryStr accepts two formats (matching the repertoire melodic search):
//      Pitch names:   "G A G F# E"
//      Scale degrees: "1 2 1 7 5"  (with optional # / b prefix per token)
//

function markMelodicMatches(kernText, queryStr) {
	const tokens = queryStr.trim().split(/\s+/);
	if (tokens.length < 2) return kernText;

	// Detect query type and build the list of values to match against.
	const isDegreeQuery = tokens.every(t => /^[#b]?[1-7]$/.test(t));
	let queryItems;
	if (isDegreeQuery) {
		queryItems = tokens;
	} else {
		queryItems = tokens.map(function(tok) {
			const m = tok.match(/^([A-Ga-g])([#b]?)$/i);
			if (!m) return null;
			return m[1].toUpperCase() + (m[2] === 'b' ? 'b' : m[2] === '#' ? '#' : '');
		}).filter(Boolean);
		if (queryItems.length < 2) return kernText;
	}

	// Extract key once (only used for degree queries, cheap for pitch queries).
	const { tonic, isMinor } = isDegreeQuery ? _kernKey(kernText) : { tonic: 0, isMinor: false };

	const lines    = kernText.split('\n');
	let   inKern   = false;
	const noteLines = [];   // { idx, pitch, degree }

	for (let i = 0; i < lines.length; i++) {
		const line = lines[i];
		if (line.startsWith('**')) {
			inKern = line.split('\t')[0] === '**kern';
			continue;
		}
		if (line.startsWith('*-'))  { inKern = false; break; }
		if (!inKern)                  continue;
		if (/^[!*=]/.test(line))      continue;

		const token = line.split('\t')[0].trim();
		if (!token || token === '.' || token[0] === '_') continue;

		const m = token.match(/([A-Ga-g]+)([#\-]*)/);
		if (!m) continue;

		const letter = m[1][0].toUpperCase();
		const acc    = m[2].includes('#') ? '#' : m[2].includes('-') ? 'b' : '';
		const pitch  = letter + acc;
		noteLines.push({
			idx:    i,
			pitch,
			degree: isDegreeQuery ? _pitchToDegree(pitch, tonic, isMinor) : null,
		});
	}

	// Find all runs of notes matching the query (pitch or degree).
	const field      = isDegreeQuery ? 'degree' : 'pitch';
	const matchedIdx = new Set();
	for (let i = 0; i <= noteLines.length - queryItems.length; i++) {
		let hit = true;
		for (let j = 0; j < queryItems.length; j++) {
			if (noteLines[i + j][field] !== queryItems[j]) { hit = false; break; }
		}
		if (hit) {
			for (let j = 0; j < queryItems.length; j++) matchedIdx.add(noteLines[i + j].idx);
		}
	}

	if (matchedIdx.size === 0) return kernText;

	// Append '@' to the first-spine token on each matched line.
	const newLines = lines.map(function(line, i) {
		if (!matchedIdx.has(i)) return line;
		const fields = line.split('\t');
		fields[0] = fields[0] + '@';
		return fields.join('\t');
	});

	newLines.push('!!!RDF**kern: @ = marked note color=#e05a00');
	return newLines.join('\n');
}




//////////////////////////////
//
// displayWorkInfo -- Show information table at top of page.
//

function displayWorkInfo(id) {
	let element = document.querySelector("#work-info");
	if (!element) {
		console.error("ERROR: no #work-info element");
		return;
	}

	if (!id) id = DATA1520.workid;
	if (!id) id = "BC001";
	DATA1520.workid = id;

	let workinfo = DATA1520.lookup.works[id];
	if (!workinfo) {
		console.error(`Error: Cannot find workinfo for ${id} in displayWorkInfo()`);
		return;
	}

	let tbody = document.querySelector("tbody#work-info-body");
	if (!tbody) {
		console.warn("Cannot find tbody#work-info-body");
		return;
	}
	if (!tbody.innerHTML.match(/^\s*$/)) return;

	// Derive collection label and GitHub paths from ID prefix
	const prefix = id.substring(0, 2);
	const dir    = prefix === "BC" ? "bc100" : prefix === "EG" ? "eg104" : "";
	const fname  = workinfo[FIELD.filename] || "";
	const rawBase    = "https://raw.githubusercontent.com/chanson-project/chanson-encoding/refs/heads/main";
	const githubBase = "https://github.com/chanson-project/chanson-encoding/blob/main";
	const rawURL    = dir && fname ? `${rawBase}/${dir}/kern/${fname}` : "";
	const githubURL = dir && fname ? `${githubBase}/${dir}/kern/${fname}` : "";

	const sourceEntry    = DATA1520.lookup.sources[prefix] || {};
	const collectionName = sourceEntry[SOURCE_FIELD.title] || prefix;
	const collectionLink = `/sources/?s=${encodeURIComponent(prefix)}`;

	// ── Left column: bibliographic ─────────────────────────────────────────────

	let titleoutput = "";
	const titleText = workinfo[FIELD.title] || "";
	if (titleText) {
		titleoutput = `<div class="work-item"><b>${t('work.title')}:</b> ${titleText}</div>`;
	}

	let composeroutput = "";
	const com = workinfo[FIELD.composer] || "";
	if (com) {
		let display = com;
		const m = com.match(/^(.*?)\s*,\s*(.*?)$/);
		if (m) display = `${m[2]} ${m[1]}`;
		composeroutput = `<div class="work-item"><b>${t('work.composer')}:</b> ${display}</div>`;
	}

	let lyricistoutput = "";
	const lyr = workinfo[FIELD.lyricist] || "";
	if (lyr) {
		let display = lyr;
		const m = lyr.match(/^(.*?)\s*,\s*(.*?)$/);
		if (m) display = `${m[2]} ${m[1]}`;
		lyricistoutput = `<div class="work-item"><b>${t('work.lyricist')}:</b> ${display}</div>`;
	}

	const collectionoutput = `<div class="work-item"><b>${t('work.collection')}:</b> <a href="${collectionLink}">${collectionName}</a></div>`;
	const pagesoutput = workinfo[FIELD.pages] ? `<div class="work-item"><b>${t('work.pages')}:</b> ${workinfo[FIELD.pages]}</div>` : "";

	const genreVal = workinfo[FIELD.genre] || "";
	const genreoutput = genreVal ? `<div class="work-item"><b>${t('work.genre')}:</b> ${genreVal}</div>` : "";

	const topicVal = workinfo[FIELD.topic] || "";
	const topicoutput = topicVal
		? `<div class="work-item"><b>${t('work.topic')}:</b> ${topicVal.split(";").map(s => s.trim()).filter(Boolean).join(", ")}</div>`
		: "";

	const laforteVal = workinfo[FIELD.laforte] || "";
	const laforteoutput = laforteVal ? `<div class="work-item"><b>${t('work.laforte')}:</b> ${laforteVal}</div>` : "";

	// ── Middle column: musical and contextual ──────────────────────────────────

	const keyVal = workinfo[FIELD.key] || "";
	const keyoutput = keyVal ? `<div class="work-item"><b>${t('work.key')}:</b> ${keyVal}</div>` : "";

	const timeVal = (workinfo[FIELD.time] || "").split(";")[0].trim();
	const timeoutput = timeVal ? `<div class="work-item"><b>${t('work.time')}:</b> ${timeVal}</div>` : "";

	const originVal = workinfo[FIELD.origin] || "";
	const originoutput = originVal
		? `<div class="work-item"><b>${t('work.origin')}:</b> ${originVal}</div>`
		: "";

	const notesoutput = workinfo.Notes
		? `<div class="work-item"><b>${t('work.notes')}:</b> ${workinfo.Notes}</div>`
		: "";

	const refRaw = workinfo[FIELD.url_reference] || "";
	const refoutput = refRaw
		? `<div class="work-item"><b>${t('work.references')}:</b> ` +
		  refRaw.split(";").map(u => {
		      u = u.trim();
		      if (!u) return "";
		      try { const label = new URL(u).hostname.replace(/^www\./, ""); return `<a href="${u}" target="_blank" rel="noopener noreferrer">${label}</a>`; }
		      catch { return `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`; }
		  }).filter(Boolean).join(" · ") + `</div>`
		: "";

	// ── Right column: encoders, links, and YouTube embed ──────────────────────

	const ytURL = workinfo[FIELD.url_youtube] || "";
	let ytoutput = "";
	if (ytURL) {
		let videoId = null;
		try {
			const u = new URL(ytURL);
			videoId = u.hostname.includes("youtu.be") ? u.pathname.slice(1) : u.searchParams.get("v");
		} catch {}
		ytoutput = videoId
			? `<div class="work-item yt-embed"><iframe src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" loading="lazy" title="${t('work.watch_on_youtube')}"></iframe></div>`
			: `<div class="work-item"><a href="${ytURL}" target="_blank" rel="noopener noreferrer">${t('work.watch_on_youtube')}</a></div>`;
	}

	let encodersoutput = "";
	const encoderList = [];
	for (let n = 1; n <= 5; n++) {
		const name = workinfo[`!!!EED${n}`];
		const date = workinfo[`!!!EEV${n}`];
		if (name) encoderList.push(date ? `${name} (${date})` : name);
	}
	if (encoderList.length) {
		const label = encoderList.length > 1 ? t('work.encoders') : t('work.encoder');
		encodersoutput = `<div class="work-item"><b>${label}:</b> ${encoderList.join(", ")}</div>`;
	}

	const scanURL = (DATA1520.metadata.scans || {})[id] || "";

	let linksoutput = "";
	if (rawURL) {
		const vhvURL = `https://verovio.humdrum.org/?k=e&file=${encodeURIComponent(rawURL)}`;
		const scanLink = scanURL ? ` | <a target="_blank" rel="noopener noreferrer" href="${scanURL}">${t('work.view_pdf')}</a>` : "";
		linksoutput = `<div class="work-item"><b>${t('work.view_on')}:</b> <a target="_blank" href="${vhvURL}">VHV</a> | <a target="_blank" href="${githubURL}">GitHub</a>${scanLink}</div>`;
	}

	const downloadoutput = rawURL
		? `<div class="work-item"><b>${t('work.download')}:</b> <a href="${rawURL}" download>${t('work.humdrum_file')}</a></div>`
		: "";

	// ── Build table row ────────────────────────────────────────────────────────

	const row = document.createElement("tr");

	const leftCell = document.createElement("td");
	leftCell.innerHTML = titleoutput + composeroutput + lyricistoutput + collectionoutput + pagesoutput + genreoutput + topicoutput + laforteoutput;
	row.appendChild(leftCell);

	const middleCell = document.createElement("td");
	middleCell.innerHTML = keyoutput + timeoutput + originoutput + notesoutput + refoutput;
	row.appendChild(middleCell);

	const rightCell = document.createElement("td");
	rightCell.innerHTML = encodersoutput + linksoutput + downloadoutput + ytoutput;
	row.appendChild(rightCell);

	tbody.appendChild(row);
}

//////////////////////////////
//
// forceDownload -- Force download of data files (instead of opening in a new browser window).
//

function forceDownload(event) {
	event.stopPropagation();   // Do not open the hyperlink.
	event.preventDefault();    // Prevent default behavior for <a>
	let target = event.target;
	let url = target.getAttribute("href");
	let filename = url.replace(/.*\//, "");
	downloadFile(url, filename);
}



//////////////////////////////
//
// downloadFile -- Save file contents to local computer.
//

function downloadFile(url, filename) {
	fetch(url)
	.then(response => response.blob())
	.then(blob => {
		const a = document.createElement('a');
		const objectURL = URL.createObjectURL(blob);
		a.href = objectURL;
		a.download = filename;
		a.click();
		URL.revokeObjectURL(objectURL);
	})
	.catch(error => {
		console.error('Error:', error);
	});
}

function displayExternalInfo(id) {
	let element = document.querySelector("#external-info");
	if (!element) {
		console.error("ERROR: no #external-info element");
		return;
	}
	if (!id) {
		id = DATA1520.workid;
	}
	let workinfo = DATA1520.lookup.works[id];
	if (!workinfo) {
		console.error(`Error: Cannot find workinfo for ID=${id}`);
	}

	let output = "";
	let title              = workinfo["Title"] || workinfo["!!!OTL@@FR"] || "";
	let externalURL        = workinfo["External Project URL"];
	let externalName       = workinfo["External Project Name"];
	let criticalCommentary = workinfo["Critical Commentary"];

	if (externalURL && externalName) {
			if (criticalCommentary == "yes") {
					output += `<center>For more information on <i>${title}</i> and the critical commentary, see <a target="_blank" href="${externalURL}">${externalName}</a>.</center><br><br>`;
			} else {
				output += `<center>For more information on <i>${title}</i>, see <a target="_blank" href="${externalURL}">${externalName}</a>.</center><br><br>`;
			}
	}
	element.innerHTML = output;
}

//////////////////////////////
//
// renderCadencePanel -- Build the inline cadence list below the score.
//

function renderCadencePanel(cadences) {
	const panel = document.getElementById("cadence-panel");
	if (!panel) return;

	if (!cadences || cadences.length === 0) {
		panel.innerHTML = `<div class="cadence-panel-heading">Cadences</div><p class="cadence-none">${t("work.cadence_none")}</p>`;
		panel.classList.remove("hidden");
		return;
	}

	const rows = cadences.map(function(cad) {
		const typeClass = cad.type === "authentic" ? "cadence-type-authentic" : "cadence-type-phrygian";
		const typeLabel = t("work.cadence_" + cad.type);
		return `<tr><td>m. ${cad.measure}</td><td class="${typeClass}">${typeLabel}</td><td class="cadence-pitch">→ ${cad.pitchCenter}</td></tr>`;
	}).join("");

	panel.innerHTML = `<div class="cadence-panel-heading">Cadences</div><table class="cadence-table"><tbody>${rows}</tbody></table>`;
	panel.classList.remove("hidden");
}





//////////////////////////////
//
// downloadAndDisplayInlinePng --
//

async function downloadAndDisplayInlinePng(url, container) {
	try {
		let titleurl    = url //.replace(/-notitle/, "");
		const response  = await fetch(url);
		const blob      = await response.blob();
		const reader    = new FileReader();
		reader.onloadend = function () {
			container.innerHTML = `<a target="_blank" href="${titleurl}"><img style="cursor:pointer"></a>`;
			let imgDiv = container.querySelector("img");
			imgDiv.src = reader.result;
		};
		reader.readAsDataURL(blob);
	} catch (error) {
		console.error("Error fetching or displaying the image:", error);
	}
}



//////////////////////////////
//
// downloadAndDisplayInlineSvg --
//

async function downloadAndDisplayInlineSvg(url, container) {
	try {
		const response = await fetch(url);
		const text     = await response.text();
		container.innerHTML = `<a style="cursor:pointer" target="_blank" href="${url}">${text}</a>`;
	} catch (error) {
		console.error("Error fetching or displaying the image:", error);
	}
}



//////////////////////////////
//
// downloadData --
//

function downloadData(container, id, ext, ID) {
	let url = `${DATA1520.dataurl}/${DATA1520.workid}-${id}.${ext}`;
	if (ext === "png") {
		downloadAndDisplayInlinePng(url, container);
	} else if (ext === "svg") {
		downloadAndDisplayInlineSvg(url, container);
	}
}

		console.error("Cannot find #audiobutton-pause");
	}
	DATA1520.audio.setAttribute('controls', 'controls');
	initializeTimemap();
}



//////////////////////////////
//
// pauseAudioCallback --
//

function pauseAudioCallback() {
	console.log("PAUSING audio");
	let audioButtonPlay  = document.querySelector("#audiobutton-play");
	let audioButtonPause = document.querySelector("#audiobutton-pause");
	if (audioButtonPlay) {
		audioButtonPlay.classList.remove("hidden");
	} else {
		console.error("Cannot find #audiobutton-play");
	}
	if (audioButtonPause) {
		audioButtonPause.classList.add("hidden");
	} else {
		console.error("Cannot find #audiobutton-pause");
	}
	unhighlightAllNotesInSvg();
	if (REFRESH) {
		clearInterval(REFRESH);
	}
}



//////////////////////////////
//
// TogglePlayPauseOfAudio --
//

function togglePlayPauseOfAudio() {
    let audio = DATA1520.audio;
    if (audio.paused) {
        audio.play();
    } else {
        audio.pause();
    }
}

</script>
