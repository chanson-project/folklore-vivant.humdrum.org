//////////////////////////////
//
// toggleAnalysisDisplay -- Show or hide analysis plots.
//

document.addEventListener("click", function(event) {
	let target = event.target;
	if (!target.classList.contains("analysis-toggle")) {
		return;
	}
	let analysisType = target.id;

	if (event.target.classList.contains("analysis-toggle")) {
		if (event.target.classList.contains("active")) {
			event.target.classList.remove("active");
		} else {
			event.target.classList.add("active");
		}
	}
	if (!analysisType) {
		console.warn("Analysis element ID was not given");
		return;
	}
	let ext = target.dataset.ext;
	if (!ext) {
		console.warn("File extension was not given.");
		return;
	}
	let container = document.querySelector(`#${analysisType}-display`);
	if (!container) {
		console.warn("No analysis container", `#${analysisType}-display`);
		return;
	}
	let contents = container.innerHTML;
	let empty = contents.length ? false : true;
	if (empty) {
		downloadData(container, analysisType, ext);
	}
	if (container.classList.contains("hidden")) {
		container.classList.remove("hidden");
	} else {
		container.classList.add("hidden");
	}
});



//////////////////////////////
//
// click event listener -- Event delegate listener for starting playback at a certain note.
//

window.addEventListener("click", function(event) {
	let target = event.target;
	let noteElement = null;

	// Find the g.note element that was clicked on.  This may not be
	// the actual element that was clicked on, but rather it could
	// be a parent element, so search the ancestors of the clicked
	// element to find g.note.  The ID of the note will start "note-".
	if (target && target.id && target.id.match(/^note-/)) {
		noteElement = target;
	} else {
		while ((!noteElement) && target) {
			target = target.parentNode;
			if (!target) {
				break;
			}
			if (target && target.id && target.id.match(/^note-/)) {
				noteElement = target;
				break;
			}
		}
	}
	if (!noteElement) {
		// Did not click on a note (or in the SVG), so give up.
		return;
	}

	// Get the start time of the note (quarter notes from begiining of score):
	let matches;
	let ques = 0;
	if (matches = noteElement.className.baseVal.match(/qon-([^\s]+)/)) {
		ques = getQstampFloat(matches[1]);
	} else {
		return;
	}

	// Find the time in seconds for the note from the timemap:
	let tstamp = -1;
	let qstamp = -1;
	let timemap = DATA1520.timemap;
	if (!timemap) {
		console.warn("Warning: cannot find timemap for highligting notation during playback.");
		return;
	}
	for (let i=0; i<timemap.length; i++) {
		if (Math.abs(timemap[i].qstamp - ques) < 0.01) {
			tstamp = timemap[i].tstamp;
			qstamp = timemap[i].qstamp;
			break;
		}
	}
	if (tstamp < 0) {
		return;
	}

	console.log("TSTAMP", tstamp, "QSTAMP", qstamp);

	let audio = DATA1520.audio;
	console.warn("CURRENT TIME", audio.currentTime);
	let adjustment = 0;
	if (audio.paused) {
		unhighlightAllNotesInSvg();
		audio.play();
		audio.currentTime = tstamp - adjustment;
	} else {
		unhighlightAllNotesInSvg();
		try {
			audio.currentTime = tstamp - adjustment;
		} catch (error) {
			console.error("Error:", error);
		}
	}
});

//////////////////////////////
//
// initializeSearchNav -- Show prev/next navigation if the current work is part
//    of a saved search result set (stored in sessionStorage by the repertoire page).
//

function initializeSearchNav() {
	let ids;
	try {
		ids = JSON.parse(localStorage.getItem("1520_search_ids") || "null");
	} catch(e) { return; }
	if (!Array.isArray(ids) || ids.length === 0) return;

	const currentId = DATA1520.workid;
	const idx = ids.indexOf(currentId);
	if (idx === -1) return;

	const nav = document.getElementById("search-nav");
	if (nav) nav.classList.remove("hidden");

	const pos = document.getElementById("nav-position");
	if (pos) pos.textContent = `${idx + 1} / ${ids.length}`;

	const prevBtn = document.getElementById("nav-prev");
	const nextBtn = document.getElementById("nav-next");
	if (prevBtn) prevBtn.disabled = (idx === 0);
	if (nextBtn) nextBtn.disabled = (idx === ids.length - 1);

	const backLink = document.getElementById("nav-back-link");
	const searchUrl = localStorage.getItem("1520_search_url");
	if (backLink && searchUrl) backLink.href = searchUrl;
}


//////////////////////////////
//
// navigateSearchResult -- Navigate to the previous (direction=-1) or next
//    (direction=+1) work in the saved search result list.
//

function navigateSearchResult(direction) {
	let ids;
	try {
		ids = JSON.parse(localStorage.getItem("1520_search_ids") || "null");
	} catch(e) { return; }
	if (!Array.isArray(ids)) return;

	const currentId = DATA1520.workid;
	const idx = ids.indexOf(currentId);
	if (idx === -1) return;

	const newIdx = idx + direction;
	if (newIdx < 0 || newIdx >= ids.length) return;

	const melody = DATA1520.cgi.melody;
	let url = `/work/?id=${ids[newIdx]}`;
	if (melody) url += `&melody=${encodeURIComponent(melody)}`;
	window.location.href = url;
}


//////////////////////////////
//
// keydown event listener -- For keyboard shortcuts.
//

document.addEventListener('keydown', function(event) {
	const active = document.activeElement;
	const inInput = active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA" || active.isContentEditable);

    if (event.code === 'Space' || event.keyCode === 32) {
        event.preventDefault();
        togglePlayPauseOfAudio();
    } else if (!inInput && (event.code === 'ArrowLeft' || event.keyCode === 37)) {
        event.preventDefault();
        navigateSearchResult(-1);
    } else if (!inInput && (event.code === 'ArrowRight' || event.keyCode === 39)) {
        event.preventDefault();
        navigateSearchResult(1);
    }
});

//////////////////////////////
//
// initializeAccidentalStateButton --
//

function initializeAccidentalStateButton() {
	let state = window.localStorage.AccidentalState;
	if (!state) {
		state = "show";
		window.localStorage.AccidentalState = "show";
	}
	let element = document.querySelector("#accidentalSelect");
	if (!element) {
		return;
	}
	let showElement = element.querySelector(".show");
	if (!showElement) {
		console.error("Cannot find accidental show button");
		return;
	}
	let hideElement = element.querySelector(".hide");
	if (!showElement) {
		console.error("Cannot find accidental hide button");
		return;
	}
	if (state === "show") {
		showElement.classList.add("hidden");
		hideElement.classList.remove("hidden");
	} else {
		showElement.classList.remove("hidden");
		hideElement.classList.add("hidden");
	}
}


//////////////////////////////
//
// createLookup -- Convert an array of objects into a lookup table, where the
//    "ID" property of the objects is used as the key value for the lookup table.
//    For example if the ID of an entry is "Jac2001" in the input array, then
//    output.Jac2001 (or output["Jac2001"]) will return the entry for work ID "Jac2001".
//

function createLookup(dataArray) {
	if (!Array.isArray(dataArray)) {
		console.error("ERROR: input is not an array:", dataArray);
		return;
	}
	let output = {};
	for (entry of dataArray) {
		let id = entry[FIELD.id]
		output[id] = entry;
	}
	return output;
}

//
// displayWork --
//

function displayWork(id) {
	console.error("========================================================");
	console.error("ID=", id, "WORIID=", DATA1520.workid);
	if (!id) {
		id = DATA1520.workid;
	}
	if (!id) {
		id = "BC001";
	}
	DATA1520.workid = id;

	if (typeof id !== "string") {
		console.error("ERROR: Work ID is not a string:", string);
		return;
	}

	// Clear POSTHTML from any previous work immediately.
	injectHtmlBlock("POSTHTML", null);

	// See https://plugin.humdrum.org/options/#list for more display options.
	// Copying default options from DATA1520.hnp_options:
	let hnpOptions = JSON.parse(JSON.stringify(DATA1520.hnp_options));

	// Set display options:
	hnpOptions.filter = [];
	if (DATA1520.filter) {
		hnpOptions.filter.push(DATA1520.filter);
	}
	if (window.localStorage.AccidentalState === "hide") {
		hnpOptions.filter.push("shed -ke s/X?i/y/g");
	}
	// When text display is active, ask Verovio to run the `text` filter.
	// The filter embeds a @@BEGIN: POSTHTML block in the filtered output,
	// which postFunctionHumdrum then extracts and injects into div.POSTHTML.
	if (TEXT_FILTER_ACTIVE) {
		hnpOptions.filter.push("text -a");
		hnpOptions.postFunctionHumdrum = function(humdrumOutput) {
			const html = extractHtmlBlock(humdrumOutput, "PREHTML");
			injectHtmlBlock("PREHTML", html);
		};
	}
	if (DEG_FILTER_ACTIVE) {
		hnpOptions.filter.push("deg");
	}
	// let prefix = id.substring(0, 2);
	// Use regular expressions (of one or more letter)
	let prefix = id.match(/^[A-Za-z]+/)?.[0].toLowerCase();
	console.error("PREFIX", prefix);

	// Hardwiring prefix is not good ;-)
	// if (prefix === "BC" || prefix === "EG") {
		// let dir = prefix === "BC" ? "bc100" : "eg104";
		let dir = prefix;
		let work = DATA1520.lookup.works[id];
		if (!work) {
			console.error("WORK NOT FOUND", id);
		} else {
			console.error("WORK FOUND", id, "WORK METADATA=", work);
		}
		let filename = work[FIELD.filename] || "";
		// sometime in the spreadsheet the .krn extension is not given (mb volume, for example).  Add it hre is it missing:
		if (!filename.match(/\.krn$/)) {
			filename += ".krn";
		}
		console.error("FILENAME", filename);
		let address = `https://raw.githubusercontent.com/chanson-project/chanson-encoding/refs/heads/main/${prefix}/kern/${filename}`;
		console.error("ADDRESS", address);
		fetch(address)
			.then(function(response) { return response.text(); })
			.then(function(kern) {
				hnpOptions.postFunction = function() {
					removeWait();
					prepareQEvents(id);
				};
				const melodyParam = DATA1520.cgi.melody || "";
				let displayKern = melodyParam ? markMelodicMatches(kern, melodyParam) : kern;
				if (CADENCE_FILTER_ACTIVE) {
					const result = markCadences(displayKern);
					displayKern = result.markedKern;
					LAST_CADENCE_LIST = result.cadences;
					renderCadencePanel(LAST_CADENCE_LIST);
				} else {
					const panel = document.getElementById('cadence-panel');
					if (panel) panel.classList.add('hidden');
				}
				document.getElementById("my-score").textContent = displayKern;
				displayHumdrum(hnpOptions);
				KernPlayer.load(kern);  // player uses original (unmarked) kern
			});
	//} else {
	//	hnpOptions.postFunction = function() {
	//		removeWait();
	//		prepareQEvents(id);
	//	};
	//	displayHumdrum(hnpOptions);
	//}

	displayWorkInfo(id);
	displayExternalInfo(id);
	displayWorkFooter(id);
}
