<style>

{% include styles/score.css %}

* { cursor: inherit; }

/* ── MIDI player ──────────────────────────────────────────────────────────── */

#kp-extras {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 8px;
}

.kp-progress {
  flex: 1;
  height: 6px;
  background: rgba(0,0,0,0.12);
  border-radius: 3px;
  cursor: pointer;
  min-width: 80px;
  max-width: 260px;
}

.kp-progress-fill {
  height: 100%;
  width: 0%;
  background: #007aff;
  border-radius: 3px;
  transition: width 0.1s linear;
  pointer-events: none;
}

.kp-tempo-wrap {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  color: #555;
  white-space: nowrap;
}

.kp-tempo-input {
  width: 52px;
  font-size: 13px;
  padding: 2px 4px;
  border: 1px solid rgba(0,0,0,0.2);
  border-radius: 4px;
  text-align: center;
}

body.wait {
	cursor: wait !important;
}

body {
  font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background-color: #FFF7E6;
}

main {
	margin-left: 30px;
	margin-right: 30px;
}

.page-content {
	min-width: 500px;
}

/* --- WORK INFO CARD --- */

#work-info {
  margin-top: 20px;
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 15px;

  background: rgba(255,140,66,0.13);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  border-radius: 20px;
  padding: 14px 18px;
  box-shadow: 0 4px 0 rgba(249,200,70,0.3), 0 8px 28px rgba(0,0,0,0.06);
}

/* hide headers completely */
#work-info thead {
  display: none;
}

/* turn row into 3-column card layout */
#work-info tbody tr {
  display: grid;
  grid-template-columns: 1.2fr 1fr 1fr;
  gap: 24px;
}

/* remove all table borders */
#work-info td {
  border: none;
  vertical-align: top;
  padding: 0;
}

#work-footer {
	max-height: 100px;
	font-size: 1.25rem;
	width: 100%;
	display: flex;
	flex-wrap: wrap;
	flex-basis: 25%;
	flex-direction: column;
}

.work-item .key {
	font-weight: bold;
	display: inline-block;
}

.work-item .key:after {
	content: ":";
	padding-right: 10px;
}

.work-item b {
  font-weight: 600;
  letter-spacing: 0.01em;
  color: #c25a00;
}

.yt-embed iframe {
  width: 100%;
  aspect-ratio: 16 / 9;
  border: none;
  border-radius: 8px;
  margin-top: 6px;
}

.info-link {
	font-size: small;
	opacity: 0.5;
}

.button,
.analysis-toggle.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  height: 44px;
  padding: 0 18px;

  font-size: 15px;
  font-weight: 700;
  font-family: "Fredoka", "Nunito", sans-serif;
  line-height: 1;
  letter-spacing: 0.02em;

  color: #2A2320;

  background: rgba(255,255,255,0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  border: 2px solid rgba(249,200,70,0.4);
  border-radius: 14px;

  box-shadow:
    0 3px 0 rgba(249,200,70,0.25),
    0 2px 8px rgba(0,0,0,0.06);

  cursor: pointer;

  transition:
    background-color 0.18s ease,
    border-color 0.18s ease,
    box-shadow 0.18s ease,
    transform 0.12s ease;
}

.button:hover,
.analysis-toggle.button:hover {
  border-color: rgba(255,140,66,0.5);
  background: rgba(255,255,255,0.98);
  transform: translateY(-2px);
  box-shadow:
    0 5px 0 rgba(255,140,66,0.2),
    0 6px 16px rgba(0,0,0,0.08);
}

.button:active,
.analysis-toggle.button:active {
  transform: translateY(1px);
  box-shadow:
    0 1px 0 rgba(249,200,70,0.2),
    0 1px 4px rgba(0,0,0,0.08);
}

.hidden {
	display: none !important;
	background: red !important;
}

.button-container {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 10px;
  align-items: center;          
  margin: 12px 0 20px;
}

#analysis-plots {
	text-align: center;
}

#accidentalSelect .button {
  min-width: 200px;
  text-align: center;
}

.kp-progress-fill {
  background: #FF8C42 !important;
}

}

.analysis-plot svg {

  display: block;
  margin: 0 auto;
}

.play, .mp3play,
.pause, .mp3pause {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  text-indent: -19999px;
  background: url('/images/mp3.svg') no-repeat center;
  cursor: pointer;

  width: 56px;
  height: 40px;

  margin-right: 6px;
  position: static;
}

.play.is-playing {
  background: url('/images/mp3-pause.svg') no-repeat center;
}


audio {
	position: fixed;
	bottom: 0px;
	right: 0px;
	z-index: 1;

}


#audiobutton-container {
	display: inline-block;
	margin: 0;
	padding: 0;
}

.bibliographic-entry:first-of-type {
    display: inline; /* Keeps entries on the same line */
    text-indent: 0; /* Resets indent so it's not affected by .work-item */
    padding-left: 0; /* Ensures alignment remains correct */
}

.bibliographic-entry:nth-of-type(n+2) {
    text-indent: 4em; /* Ensures the second citation starts on a new line, indented once from "Modern Editions:" */
    margin-left: 1.8em; /* Moves the start of the second citation one level deeper */
    padding-left: 0em; /* Indents wrapped lines twice from "Modern Editions:" */
}

.mensuration-sign {
  height: 28px;
  margin-right: 6px;
  vertical-align: middle;
  opacity: 0.9;
}

.mensuration-sign:first-of-type {
	margin-left: 6px;
}

#search-nav {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 8px 0 4px;
}

.nav-btn {
  min-width: 36px;
  padding: 0 10px;
  font-size: 15px;
  text-decoration: none;
}

.nav-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  pointer-events: none;
}

#nav-position {
  font-size: 13px;
  color: #555;
  min-width: 60px;
  text-align: center;
}
